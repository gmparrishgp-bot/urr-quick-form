name: Materialize real URR fixture
on:
  push:
    branches: [urr-dev]
    paths: [.github/workflows/materialize-real-fixture.yml]
permissions:
  contents: write
jobs:
  fixture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reconstruct collected RO 105470 fixture
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64

          paths=sorted(Path('validation').glob('actual-sheet-105470-hi-p*.b64'))
          if not paths: raise SystemExit('No high-resolution fixture chunks found')
          payload=b''
          for p in paths:
            s=''.join(p.read_text().split())
            block=base64.b64decode(s, validate=True)
            print(p.name, 'decoded bytes', len(block))
            payload += block
          if not payload.startswith(b'\xff\xd8\xff'):
            raise SystemExit(f'Not a JPEG start: {payload[:12]!r}')
          if not payload.rstrip().endswith(b'\xff\xd9'):
            raise SystemExit('Reconstructed payload has no JPEG EOI marker')
          out=Path('validation/actual-sheet-105470-hi-decoded.jpg')
          out.write_bytes(payload)
          print(out, 'chunks', len(paths), 'bytes', len(payload), 'JPEG markers OK')
          PY
          file validation/actual-sheet-105470-hi-decoded.jpg | tee /tmp/filecheck
          grep -q 'JPEG image data' /tmp/filecheck
      - name: Commit verified fixture
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add validation/actual-sheet-105470-hi-decoded.jpg
          git commit -m 'Materialize verified high resolution RO 105470 fixture' || exit 0
          git push
