name: Materialize real URR fixture
on:
  push:
    branches: [urr-dev]
    paths: [.github/workflows/materialize-real-fixture.yml]
permissions:
  contents: write
jobs:
  fixture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reconstruct collected RO 105470 fixture
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64, io
          from PIL import Image

          paths=sorted(Path('validation').glob('actual-sheet-105470-hi-p*.b64'))
          if not paths: raise SystemExit('No high-resolution fixture chunks found')
          payload=b''
          for p in paths:
            s=''.join(p.read_text().split())
            block=base64.b64decode(s, validate=True)
            print(p.name, 'decoded bytes', len(block))
            payload += block
          out=Path('validation/actual-sheet-105470-hi-decoded.jpg')
          out.write_bytes(payload)
          print(out, 'chunks', len(paths), 'bytes', len(payload), 'head', payload[:12])
          try:
            im=Image.open(io.BytesIO(payload)); size=im.size; fmt=im.format; im.verify()
            print('PIL VERIFY OK', fmt, size)
          except Exception as e:
            raise SystemExit(f'Invalid reconstructed image: {e}')
          PY
          file validation/actual-sheet-105470-hi-decoded.jpg
      - name: Commit verified fixture
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add validation/actual-sheet-105470-hi-decoded.jpg
          git commit -m 'Materialize verified high resolution RO 105470 fixture' || exit 0
          git push
