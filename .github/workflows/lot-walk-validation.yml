name: Lot Walk validation
on:
  push:
    paths:
      - 'lot-walk/**'
      - '.github/workflows/lot-walk-validation.yml'
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check app
        run: |
          node --check lot-walk/app.js
          node --check lot-walk/enhancements.js
          node --check lot-walk/pairing.js
          for f in lot-walk/scanner-v*.js; do node --check "$f"; done
      - name: Matching regression
        run: node lot-walk/validation/matching.test.js
      - name: Validate real fixture bytes
        run: |
          python3 - <<'PY'
          from pathlib import Path
          files=['4746_actual_crop.jpg','1174_actual_crop.jpg','L3116_crop.jpg','839289_crop.jpg']
          for name in files:
              p=Path('lot-walk/validation/real')/name
              b=p.read_bytes()
              assert b[:2]==b'\xff\xd8' and b[-2:]==b'\xff\xd9', f'invalid JPEG {p}'
              print('VALID JPEG',p,len(b))
          PY
      - name: Install browser test runtime
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Browser OCR and pairing smoke
        run: |
          python3 -m http.server 4173 >/tmp/lotwalk-http.log 2>&1 &
          node lot-walk/validation/browser-smoke.test.js
