name: URR handwriting regression
on:
  push:
    branches: [urr-dev]
    paths:
      - tests/qwen2vl_regression.mjs
      - .github/workflows/urr-handwriting-regression.yml
  workflow_dispatch:
jobs:
  handwriting:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm init -y
      - run: npm install @huggingface/transformers@4.2.0
      - name: Test Qwen2-VL on real URR handwriting
        run: node tests/qwen2vl_regression.mjs
