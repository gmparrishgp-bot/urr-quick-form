name: URR R22 full-sheet regression
on:
  workflow_dispatch:
  push:
    paths:
      - 'urr-r20/**'
      - 'urr-r21/domain.js'
      - 'urr-r21/learning-hooks.js'
      - 'urr-r22/**'
      - 'staging-r22.html'
      - '.github/workflows/urr-r22-fullsheet.yml'
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser driver
        run: npm install --no-save puppeteer-core@24
      - name: Start local site
        run: |
          python3 -m http.server 8000 >/tmp/urr-http.log 2>&1 &
          sleep 2
      - name: Run R22 full-sheet OCR regression
        id: test
        continue-on-error: true
        run: node urr-r22/fullsheet-smoke.mjs
      - name: Record validation result
        run: |
          cp validation/r22-fullsheet-result.json /tmp/r22-fullsheet-result.json
          git config user.name 'urr-validation-bot'
          git config user.email 'urr-validation-bot@users.noreply.github.com'
          for attempt in 1 2 3 4; do
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/r22-fullsheet-result.json validation/r22-fullsheet-result.json
            git add validation/r22-fullsheet-result.json
            if git diff --cached --quiet; then exit 0; fi
            git commit -m 'Record R22 full-sheet OCR validation result'
            if git push origin main; then exit 0; fi
            sleep $((attempt * 2))
          done
          echo 'Could not publish full-sheet validation result after retries.' >&2
          exit 1
      - name: Enforce validation
        if: steps.test.outcome != 'success'
        run: exit 1
