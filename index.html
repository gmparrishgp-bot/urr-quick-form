0}.price{font-weight:800}.actions{display:flex;gap:6px;align-items:center}.copied{font-size:11px;color:#147a3f;font-weight:700}.comment{grid-column:1/-1;color:#8a6200;font-size:12px}.source-gallery{display:flex;gap:10px;flex-wrap:wrap;margin-top:8px}.source-gallery img{width:170px;max-height:240px;object-fit:contain;border-radius:8px;border:1px solid #d8dee9;background:#fff}.ai-status{padding:10px 12px;border-radius:8px;background:#eef2f6;margin:10px 0;font-weight:700}.ai-status.ready{background:#dff7e8;color:#147a3f}.ai-status.error{background:#fee4e2;color:#b42318}.progress-wrap{height:14px;background:#e4e7ec;border-radius:999px;overflow:hidden;margin:8px 0 4px}.progress-bar{height:100%;width:0%;background:#175cd3;transition:width .25s ease}.progress-label{font-size:12px;color:#667085}.phone{max-width:520px;margin:0 auto;padding:22px}.phone h1{text-align:center}.big{display:block;width:100%;font-size:22px;padding:22px;margin:18px 0;border:0;border-radius:14px;font-weight:800;color:#fff;background:#172033;text-align:center}.big.approval{background:#0b6bcb}.phone input[type=file]{display:none}.msg{padding:12px;border-radius:10px;background:#eef2f6;margin-top:12px;text-align:center}.msg.connected{background:#dff7e8;color:#147a3f}.msg.error{background:#fee4e2;color:#b42318}.retry-link{display:block;margin-top:10px;font-weight:800;text-decoration:underline;cursor:pointer;color:#175cd3}.spinner{display:inline-block;width:16px;height:16px;border:2px solid #ddd;border-top-color:#172033;border-radius:50%;animation:spin .8s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}@media(max-width:900px){.grid{grid-template-columns:1fr}.job{grid-template-columns:60px 100px 1fr 80px 90px}.price{grid-column:1/3}.actions{grid-column:3/-1}}@media(max-width:620px){.wrap{padding:10px}.brand{font-size:22px}}

<body><div id="app"></div>
<script>
"use strict";
const RATE=199;
const HEADER_COLS={
  make:{x0:.045,x1:.180},
  model:{x0:.180,x1:.310},
  stock:{x0:.310,x1:.430},
  ro:{x0:.430,x1:.550},
  date:{x0:.550,x1:.680},
  tech:{x0:.680,x1:.800},
  outfitter:{x0:.800,x1:.955}
};
const qs=new URLSearchParams(location.search);
const phoneMode=qs.get("mode")==="phone" && qs.get("peer");

function esc(v){return String(v??"").replace(/[&<>'"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","'":"&#39;",'"':"&quot;"}[c]));}
function calc(h,p){h=parseFloat(h);p=parseFloat(p);if(Number.isNaN(h)&&Number.isNaN(p))return null;return Math.ceil((((Number.isNaN(h)?0:h*RATE)+(Number.isNaN(p)?0:p))/5))*5;}
function money(v){return v==null?"—":"$"+Number(v).toLocaleString("en-US",{maximumFractionDigits:0});}
function normKey(t){return String(t||"").toUpperCase().replace(/[^A-Z0-9]+/g," ").trim();}
function tokenSet(t){return new Set(normKey(t).split(/\s+/).filter(x=>x.length>1));}
function titleSimilarity(a,b){
 const A=tokenSet(a),B=tokenSet(b);if(!A.size||!B.size)return 0;
 let same=0;for(const x of A)if(B.has(x))same++;
 return same/Math.max(A.size,B.size);
}
function simpleHash(s){
 s=String(s||"");let h=2166136261>>>0;
 for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619);}
 return (h>>>0).toString(36);
}
function normalized(t){return String(t||"").replace(/curb\s*side|door\s*side/gi,"DS").replace(/driver\s*side|off\s*door\s*side/gi,"ODS").replace(/wheel\s*bearing\s*pack/gi,"WBP").replace(/\s+/g," ").trim();}
function findRO(t){for(const p of [/\bRO\s*(?:#|NO\.?|NUMBER)?\s*[:#-]?\s*(\d{4,8})\b/i,/\bREPAIR\s+ORDER\s*[:#-]?\s*(\d{4,8})\b/i,/\bWO\s*[:#-]?\s*(\d{4,8})\b/i]){const m=t.match(p);if(m)return m[1]}return "";}
function hours(line){for(const p of [/\b(?:LABOR|LAB|HRS?|HOURS?)\s*[:=-]?\s*(\.?\d+(?:\.\d+)?)\b/i,/\b(\d+(?:\.\d+)?)\s*(?:HRS?|HOURS?)\b/i]){const m=line.match(p);if(m)return m[1].replace(/^\./,"0.")}return "";}
function parts(line){for(const p of [/\b(?:PARTS?|PTS?)\s*[:=-]?\s*\$?\s*(\d+(?:\.\d{1,2})?)/i,/\$\s*(\d+(?:\.\d{1,2})?)/]){const m=line.match(p);if(m)return m[1]}return "";}
function strip(line){return normalized(line.replace(/\b(?:LABOR|LAB|HRS?|HOURS?|PARTS?|PTS?)\b\s*[:=-]?\s*\$?\s*\.?\d+(?:\.\d+)?/gi," ").replace(/\$\s*\d+(?:\.\d+)?/g," ").replace(/\b\d+(?:\.\d+)?\s*(?:HRS?|HOURS?)\b/gi," "));}
function parseQuote(text){
 const lines=text.replace(/\r/g,"").split("\n").map(x=>x.trim()).filter(Boolean),jobs=[];let pending="";
 for(const raw of lines){let line=normalized(raw);if(line.length<3||/^(RO|REPAIR ORDER|CUSTOMER|VIN|STOCK|DATE|TECH|TECHNICIAN)\b/i.test(line))continue;
 const nm=line.match(/^\s*(\d{1,2})[.)-]?\s+(.+)/);let num="",body=line;if(nm){num=nm[1];body=nm[2]}
 const h=hours(line),p=parts(line),meaning=/[A-Za-z]{3,}/.test(body);
 if((h||p)&&meaning){let title=strip(body).replace(/^[-:]+|[-:]+$/g,"").trim();if(pending){title=(pending+" "+title).trim();pending=""}jobs.push({num:num||jobs.length+1,title:title||"REVIEW TECH DESCRIPTION",hours:h,parts:p,status:"PENDING",confidence:.7,comment:"Browser-read result — verify handwriting."});}
 else if(num&&meaning){pending=body;} else if(meaning&&line.length>12){pending=pending?pending+" "+line:line;}
 }
 if(!jobs.length){lines.filter(x=>/[A-Za-z]{4,}/.test(x)).slice(0,12).forEach((x,i)=>jobs.push({num:i+1,title:strip(x),hours:hours(x),parts:parts(x),status:"PENDING",confidence:.45,comment:"Low-confidence browser read."}));}
 return {ro:findRO(text),jobs,notes:["Local browser OCR used. Verify flagged fields before DMS copy."]};
}
function parseApproval(text){
 const lines=text.replace(/\r/g,"").split("\n").map(normalized).filter(Boolean),jobs=[];let last="";
 for(const line of lines){const nm=line.match(/^\s*(\d{1,2})[.)-]?\s+/);if(nm)last=nm[1];let s="";if(/\b(?:FIX|APPROVE[DS]?|APPROVED|YES)\b/i.test(line))s="APPROVED";else if(/\b(?:AS\s*IS|DECLINE[DS]?|DECLINED|NO)\b/i.test(line))s="DECLINED";else if(/\bRECON\b/i.test(line))s="RECON";else if(/\bNOTE\b/i.test(line))s="NOTE";if(s)jobs.push({num:last||jobs.length+1,status:s,title:strip(line)});}
 return {ro:findRO(text),jobs,notes:jobs.length?[]:["Approval marks were not read confidently. Review statuses."]};
}
async function compress(file,max=1280,q=.86){return new Promise((res,rej)=>{const r=new FileReader(),img=new Image();r.onerror=rej;r.onload=()=>img.src=r.result;img.onload=()=>{let w=img.width,h=img.height,s=Math.min(1,max/Math.max(w,h));w=Math.round(w*s);h=Math.round(h*s);const c=document.createElement("canvas");c.width=w;c.height=h;c.getContext("2d").drawImage(img,0,0,w,h);res(c.toDataURL("image/jpeg",q));};r.readAsDataURL(file);});}
async function analyze(data,kind,progress){if(typeof Tesseract==="undefined")throw new Error("Photo reader did not load.");const r=await Tesseract.recognize(data,"eng",{logger:m=>{if(m.status==="recognizing text")progress(Math.round((m.progress||0)*100))}});const text=r.data.text||"";if(!text.trim())throw new Error("No readable text found. Retake closer.");return kind==="approval"?parseApproval(text):parseQuote(text);}

function phoneApp(){
 const host=qs.get("peer");
 app.innerHTML=`<div class="phone"><h1>URR Quick Form</h1><div id="pstatus" class="msg">Connecting to computer…</div><label id="quoteLabel" class="big" for="quote">TAKE QUOTE PHOTO</label><input id="quote" type="file" accept="image/*" capture="environment"><label class="big approval" for="approval">TAKE APPROVAL PHOTO</label><input id="approval" type="file" accept="image/*" capture="environment"><div id="pmsg" class="msg">Waiting for connection.</div></div>`;
 const ps=document.getElementById("pstatus"),pm=document.getElementById("pmsg"),quoteLabel=document.getElementById("quoteLabel");
 function setPhoneConnectionError(message){
   ps.className="msg error";
   ps.innerHTML=`${message}<div class="retry-link" style="text-decoration:none;color:inherit;cursor:default">Leave this page open, refresh the computer page, then scan its new QR with the phone camera.</div>`;
 }

 if(typeof Peer==="undefined"){setPhoneConnectionError("Pairing library did not load.");return;}
 const peer=new Peer();let conn=null;
 peer.on("open",()=>{
   conn=peer.connect(host,{reliable:true});
   conn.on("open",()=>{
     ps.textContent="Connected to computer";
     ps.className="msg connected";
     pm.textContent="Ready to take a photo.";
     pm.className="msg connected";
   });
   conn.on("data",d=>{
     if(!d)return;
     if(d.type==="ro"){pm.textContent=d.ro?`RO #${d.ro}`:"Ready to take a photo.";}
     else if(d.type==="ai_progress"){
       const pct=Number.isFinite(d.percent)?` ${d.percent}%`:"";
       pm.textContent=(d.message||"Computer is reading the photo…")+pct;
       pm.className="msg";
     }else if(d.type==="analysis_done"){
       pm.textContent=d.ro?`Analysis complete — RO #${d.ro}`:"Analysis complete. Review the computer.";
       pm.className="msg connected";
     }else if(d.type==="analysis_error"){
       pm.textContent="Computer could not finish the read. Review the computer.";
       pm.className="msg error";
     }else if(d.type==="request_additional_page"){
       quoteLabel.textContent="TAKE NEXT PAGE PHOTO";
       pm.textContent="Computer is ready for another URR page.";
       pm.className="msg connected";
       quoteLabel.scrollIntoView({behavior:"smooth",block:"center"});
     }
   });
   conn.on("error",e=>{
     console.error(e);
     ps.textContent="Phone connection error — refresh the computer and scan its new QR.";
     ps.className="msg error";
   });
   conn.on("close",()=>{
     ps.textContent="Phone disconnected — refresh the computer and scan its new QR.";
     ps.className="msg error";
   });
 });
 peer.on("error",e=>{
   console.error(e);
   ps.textContent="Could not connect — refresh the computer and scan its new QR.";
   ps.className="msg error";
 });
 for(const kind of ["quote","approval"]){
  document.getElementById(kind).addEventListener("change",async ev=>{
    const f=ev.target.files[0];
    if(!f)return;
    if(!conn||!conn.open){pm.textContent="Phone is not connected to the computer.";pm.className="msg error";return;}
    try{
      pm.innerHTML='<span class="spinner"></span> Sending photo to computer…';
      const data=await compress(f,2600,.94);
      conn.send({type:"photo",kind,sourceImage:data,ts:Date.now()});
      conn.send({type:"refresh",reason:kind+"_photo_sent",ts:Date.now()});
      pm.textContent=`${kind==="quote"?"URR page":"Approval"} photo sent. Computer is reading it. Keep this page open.`;
      pm.className="msg connected";
    }catch(e){
      pm.textContent=e.message||"Could not send photo";
      pm.className="msg error";
    }finally{
      ev.target.value="";
    }
  });
}
}

function desktopApp(){
 let state={ro:"",jobs:[],notes:[],sheetCount:0};
 window.state=state;
 app.innerHTML=`<div class="wrap"><div class="top"><div><div class="brand">URR Quick Form</div><div class="muted">Phone capture → computer review → DMS copy • R15 • NEIGHBOR-BOUNDED REPAIRS • LIVE SYNC</div></div><span id="dstatus" class="status">Waiting for phone</span></div><div class="grid"><div class="card qrbox"><h3>Pair Phone</h3><div id="qr" class="qr">Creating QR…</div><div id="pairFallback" style="display:none"></div><p class="muted">Scan this QR with the phone camera.</p><div class="ro-row"><b>RO#</b><input id="ro" placeholder="Required" value="${esc(state.ro)}"></div><div id="roBanner" class="banner">RO# is required.</div><div class="toolbar"><button id="morePages" class="btn secondary">+ Add Additional Page</button></div></div><div class="card"><div><b>Jobs</b> <span class="muted">Review orange fields before copying.</span></div><div id="aiStatus" class="ai-status">Take the first URR photo from the phone. The reader isolates each repair before handwriting recognition and supports repairs written below the printed table. Use “Add Additional Page” for more sheets.</div><div class="progress-wrap"><div id="aiProgress" class="progress-bar"></div></div><div id="aiProgressLabel" class="progress-label">Waiting for photo.</div><div id="sourceWrap" class="source" style="display:none;margin:12px 0"><b>Source photos</b><div id="sourceGallery" class="source-gallery"></div></div><div id="jobs" class="jobs"></div><div id="notes" class="muted" style="margin-top:12px"></div></div></div></div>`;
 const ds=document.getElementById("dstatus"),q=document.getElementById("qr"),ro=document.getElementById("ro"),banner=document.getElementById("roBanner"),sourceWrap=document.getElementById("sourceWrap"),sourceGallery=document.getElementById("sourceGallery");
 const aiStatus=document.getElementById("aiStatus"),aiProgress=document.getElementById("aiProgress"),aiProgressLabel=document.getElementById("aiProgressLabel");
 let paddleModule=null,ocr=null,hfModule=null,trocr=null,aiLoading=null,currentPhoto=null;

 let conn=null,peer=null;

 function setAIProgress(percent,message,cls=""){
   const pct=Math.max(0,Math.min(100,Number(percent)||0));
   aiProgress.style.width=pct+"%";
   aiProgressLabel.textContent=message||"";
   aiStatus.textContent=message||"";
   aiStatus.className="ai-status"+(cls?" "+cls:"");
   if(conn&&conn.open)conn.send({type:"ai_progress",message:message||"",percent:pct});
 }

 async function ensureHandwritingModel(){
   if(ocr&&trocr)return;
   if(aiLoading)return aiLoading;
   aiLoading=(async()=>{
     setAIProgress(3,"Loading form reader…");

     paddleModule=await import("https://cdn.jsdelivr.net/npm/@paddleocr/paddleocr-js/+esm");
     const {PaddleOCR}=paddleModule;
     if(!PaddleOCR)throw new Error("PaddleOCR browser SDK did not load.");

     ocr=await PaddleOCR.create({
       textDetectionModelName:"PP-OCRv5_mobile_det",
       textRecognitionModelName:"PP-OCRv5_mobile_rec",
       textDetectionBatchSize:1,
       textRecognitionBatchSize:8,
       ortOptions:{backend:"auto"}
     });
     setAIProgress(25,"Form reader ready. Loading handwriting model…");

     hfModule=await import("https://cdn.jsdelivr.net/npm/@huggingface/transformers@3.8.1");
     const {pipeline}=hfModule;
     trocr=await pipeline("image-to-text","Xenova/trocr-base-handwritten",{
       device:navigator.gpu?"webgpu":"wasm",
       dtype:"q8",
       progress_callback:x=>{
         if(x&&x.status==="progress"&&Number.isFinite(x.progress)){
           setAIProgress(25+Math.round(x.progress*.30),`Loading handwriting model… ${Math.round(x.progress)}%`);
         }
       }
     });

     setAIProgress(56,"Handwriting reader ready.","ready");
   })().catch(e=>{aiLoading=null;throw e;});
   return aiLoading;
 }

 function loadImg(src){
   return new Promise((resolve,reject)=>{
     const im=new Image();
     im.onload=()=>resolve(im);
     im.onerror=()=>reject(new Error("Could not open the URR photo."));
     im.src=src;
   });
 }

 function detectPaperRect(img){
   const max=600,s=Math.min(1,max/Math.max(img.naturalWidth,img.naturalHeight));
   const c=document.createElement("canvas");
   c.width=Math.max(1,Math.round(img.naturalWidth*s));c.height=Math.max(1,Math.round(img.naturalHeight*s));
   const ctx=c.getContext("2d",{willReadFrequently:true});ctx.drawImage(img,0,0,c.width,c.height);
   const d=ctx.getImageData(0,0,c.width,c.height).data,xs=[],ys=[];
   for(let y=0;y<c.height;y+=2)for(let x=0;x<c.width;x+=2){
     const i=(y*c.width+x)*4,r=d[i],g=d[i+1],b=d[i+2],lum=(r+g+b)/3,spread=Math.max(r,g,b)-Math.min(r,g,b);
     if(lum>138&&spread<90){xs.push(x);ys.push(y);}
   }
   if(xs.length<500)return{x:0,y:0,w:img.naturalWidth,h:img.naturalHeight};
   xs.sort((a,b)=>a-b);ys.sort((a,b)=>a-b);const q=(a,p)=>a[Math.max(0,Math.min(a.length-1,Math.floor(a.length*p)))];
   let x0=q(xs,.012)/s,x1=q(xs,.988)/s,y0=q(ys,.008)/s,y1=q(ys,.994)/s;
   if(x1-x0<img.naturalWidth*.48||y1-y0<img.naturalHeight*.58)return{x:0,y:0,w:img.naturalWidth,h:img.naturalHeight};
   const px=(x1-x0)*.012,py=(y1-y0)*.01;
   return{x:Math.max(0,x0-px),y:Math.max(0,y0-py),w:Math.min(img.naturalWidth-x0+px,x1-x0+2*px),h:Math.min(img.naturalHeight-y0+py,y1-y0+2*py)};
 }

 function normalizePaperCanvas(img,paper){
   const c=document.createElement("canvas");c.width=1200;c.height=1680;
   const ctx=c.getContext("2d",{willReadFrequently:true,alpha:false});ctx.fillStyle="#fff";ctx.fillRect(0,0,c.width,c.height);
   ctx.drawImage(img,paper.x,paper.y,paper.w,paper.h,0,0,c.width,c.height);return c;
 }

 function polyBox(item,w,h){
   const p=item?.poly||item?.polygon||[];let pts=[];
   if(Array.isArray(p)){
     for(const q of p){
       if(Array.isArray(q)&&q.length>=2)pts.push([Number(q[0]),Number(q[1])]);
       else if(q&&typeof q==="object")pts.push([Number(q.x??q[0]),Number(q.y??q[1])]);
     }
     if(!pts.length&&p.length>=8&&typeof p[0]==="number")for(let i=0;i+1<p.length;i+=2)pts.push([Number(p[i]),Number(p[i+1])]);
   }
   if(!pts.length)return{x0:0,y0:0,x1:w,y1:h,cx:w/2,cy:h/2,bw:w,bh:h};
   const xs=pts.map(x=>x[0]),ys=pts.map(x=>x[1]);const x0=Math.min(...xs),x1=Math.max(...xs),y0=Math.min(...ys),y1=Math.max(...ys);
   return{x0,y0,x1,y1,cx:(x0+x1)/2,cy:(y0+y1)/2,bw:x1-x0,bh:y1-y0};
 }

 function cleanText(s){return String(s||"").replace(/[“”]/g,'"').replace(/[‘’]/g,"'").replace(/\s+/g," ").trim();}
 function normalizeRV(s){
   s=cleanText(s);
   const reps=[[/\boff\s*door\s*side\b/ig,"ODS"],[/\bdoor\s*side\b/ig,"DS"],[/\bwheel\s*bearing\s*(?:pack|repack)\b/ig,"WBP"],[/\bWBR\b/ig,"WBP"],[/\bdriver\s*side\b/ig,"ODS"],[/\bcurb\s*side\b/ig,"DS"]];
   for(const [a,b] of reps)s=s.replace(a,b);return s;
 }
 function stripRepairNumbers(s){
   return normalizeRV(String(s||"")
     .replace(/^\s*\d{1,3}\s*[.)\-:]\s*/," ")
     .replace(/\$\s*\d+(?:[.,]\d{1,2})?/g," ")
     .replace(/\b\d*\.\d+\s*(?:hrs?|hours?|hr)?\b/ig," ")
     .replace(/\b\d+(?:\.\d+)?\s*(?:hrs?|hours?|hr)\b/ig," ")
     .replace(/\b(?:recon|note)\b/ig," ")
     .replace(/^[\s\-–—:;,.]+|[\s\-–—:;,.]+$/g," "));
 }
 function isPrintedNoise(s){
   s=String(s||"").toLowerCase();
   return /^(?:make|model|stock#?|ro#?|date|tech|outfitter|required y\/?n|problem found|repair needed|total cost|of repair|fix|authed|as is|not authed|sm\/?gm|signature|total dollars approved)$/.test(s)||
     /bish.?s rv used|recommended repairs/.test(s);
 }
 function plausibleDescription(s){
   s=stripRepairNumbers(s);if(s.length<3)return false;
   if(/^(?:[a-z]\s+){4,}[a-z]$/i.test(s)||/^(?:1\s*){4,}/.test(s))return false;
   return /[a-z]{2,}/i.test(s);
 }

 function detectHeaderColumns(canvas){
   // The printed header is invariant:
   // Make | Model | Stock# | RO# | Date | Tech | Outfitter.
   // We snap the known boundaries to the actual photographed grid lines so perspective
   // does not shift Stock# into RO#.
   const expected=[.050,.195,.313,.431,.550,.672,.795,.925];
   const ctx=canvas.getContext("2d",{willReadFrequently:true});
   const W=canvas.width,H=canvas.height;
   const y0=Math.floor(.105*H),y1=Math.floor(.225*H);
   const data=ctx.getImageData(0,y0,W,Math.max(1,y1-y0)).data;
   const score=new Array(W).fill(0);
   const rh=y1-y0;
   for(let y=0;y<rh;y++){
     for(let x=0;x<W;x++){
       const k=(y*W+x)*4,r=data[k],g=data[k+1],b=data[k+2];
       const lum=.299*r+.587*g+.114*b;

   }

     const center=Math.round(ex*W),radius=Math.round(.042*W);
     let bx=center,bs=-1;
     for(let x=Math.max(0,center-radius);x<=Math.min(W-1,center+radius);x++){

     }
     // Require a meaningful vertical line; otherwise use the invariant position.

   }
   for(let k=1;k<bounds.length;k++){
     if(bounds[k]<=bounds[k-1]+.055)bounds[k]=expected[k];
   }
   return{
     make:{x0:bounds[0],x1:bounds[1]},
     model:{x0:bounds[1],x1:bounds[2]},
     stock:{x0:bounds[2],x1:bounds[3]},
     ro:{x0:bounds[3],x1:bounds[4]},
     date:{x0:bounds[4],x1:bounds[5]},
     tech:{x0:bounds[5],x1:bounds[6]},
     outfitter:{x0:bounds[6],x1:bounds[7]}

 function groupProjectionScored(proj,gap=4,minTotal=100){
   const ys=[];
   for(let y=0;y<proj.length;y++)if(proj[y]>2)ys.push(y);
   const groups=[];
   for(const y of ys){
     if(!groups.length||y-groups[groups.length-1][groups[groups.length-1].length-1]>gap)groups.push([y]);
     else groups[groups.length-1].push(y);
   }
   const out=[];
   for(const g of groups){
     let total=0,weighted=0;
     for(let y=g[0];y<=g[g.length-1];y++){total+=proj[y];weighted+=proj[y]*y;}
     if(total>=minTotal)out.push({y:(weighted/Math.max(1,total))/proj.length,total});
   }

   // Search only positions that fit the form's row rhythm.

   // the signature area. Below-table repairs with red dashes are already anchors.
   for(let yy=anchors[anchors.length-1].y+rowGap;yy<.845;yy+=rowGap)out.push(yy);

     .map(x=>x.y).filter(y=>y>.175&&y<.995);

 function makeTrocrCrop(canvas,x0,y0,x1,y1,mode="description",targetW=1100){
   const sx=Math.max(0,Math.floor(x0*canvas.width));
   const sy=Math.max(0,Math.floor(y0*canvas.height));
   const sw=Math.max(1,Math.floor((x1-x0)*canvas.width));
   const sh=Math.max(1,Math.floor((y1-y0)*canvas.height));
   const scale=Math.min(5,targetW/sw);
   const c=document.createElement("canvas");
   c.width=Math.max(160,Math.round(sw*scale));
   c.height=Math.max(72,Math.round(sh*scale*1.55));
   const ctx=c.getContext("2d",{willReadFrequently:true,alpha:false});
   ctx.fillStyle="#fff";ctx.fillRect(0,0,c.width,c.height);
   const dy=Math.round(c.height*.10),dh=Math.round(c.height*.80);
   ctx.drawImage(canvas,sx,sy,sw,sh,0,dy,c.width,dh);

   const im=ctx.getImageData(0,0,c.width,c.height),d=im.data;
   let ink=0;
   for(let i=0;i<d.length;i+=4){
     const r=d[i],g=d[i+1],b=d[i+2];
     const lum=.299*r+.587*g+.114*b;
     const spread=Math.max(r,g,b)-Math.min(r,g,b);
     let keep=true;
     if(mode==="description"){
       // Keep black/gray handwriting, suppress red quote amounts and purple totals.
       keep=lum<220 && spread<58;
     }else if(mode==="descriptionSoft"){
       // Second description pass: retain faint pencil/black handwriting without allowing
       // red parts prices or purple Total Cost writing back into the description.
       const redLike=r>70&&r>g*1.07&&r>b*1.03&&(r-g)>8;
       const purpleLike=b>r*1.04&&b>g*1.02&&(b-r)>6;
       keep=lum<232 && !redLike && !purpleLike;
     }else if(mode==="parts"){
       keep=r>70 && r>g*1.10 && r>b*1.05 && (r-g)>10;
     }else if(mode==="hours"){
       keep=lum<215 && spread<62;
     }else if(mode==="total"){
       keep=lum<225;
     }
     let v=255;
     if(keep){
       v=Math.max(0,Math.min(255,(lum-45)*1.50));
       if(v<205)ink++;
     }
     d[i]=d[i+1]=d[i+2]=v;d[i+3]=255;
   }
   ctx.putImageData(im,0,0);

   // Remove long horizontal/vertical grid-line remnants without erasing handwriting.
   const w=c.width,h=c.height;
   const id=ctx.getImageData(0,0,w,h),px=id.data;
   const rowInk=new Array(h).fill(0),colInk=new Array(w).fill(0);
   for(let y=0;y<h;y++)for(let x=0;x<w;x++){
     if(px[(y*w+x)*4]<115){rowInk[y]++;colInk[x]++;}
   }
   for(let y=0;y<h;y++){
     if(rowInk[y]>w*.72){
       for(let yy=Math.max(0,y-1);yy<=Math.min(h-1,y+1);yy++)
         for(let x=0;x<w;x++){const k=(yy*w+x)*4;px[k]=px[k+1]=px[k+2]=255;}
     }
   }
   for(let x=0;x<w;x++){
     if(colInk[x]>h*.70){
       for(let xx=Math.max(0,x-1);xx<=Math.min(w-1,x+1);xx++)
         for(let y=0;y<h;y++){const k=(y*w+xx)*4;px[k]=px[k+1]=px[k+2]=255;}
     }
   }
   ctx.putImageData(id,0,0);
   return{url:c.toDataURL("image/png"),density:ink/Math.max(1,w*h)};

 function parseTrocrParts(s){
   s=String(s||"").replace(/[Oo]/g,"0").replace(/,/g,".").trim();
   const dollar=[...s.matchAll(/\$\s*(\d+(?:\.\d{1,2})?)/g)]
     .map(m=>Number(m[1])).filter(v=>Number.isFinite(v)&&v>=0&&v<=99999);
   if(dollar.length){
     // A repair can list more than one part amount (e.g. chassis + coach battery).
     return String(dollar.reduce((a,b)=>a+b,0));
   }

   const partWord=s.match(/\bparts?\b[^0-9]{0,12}(\d+(?:\.\d{1,2})?)/i);
   if(partWord){
     const v=Number(partWord[1]);
     if(Number.isFinite(v)&&v>=0&&v<=99999)return String(v);
   }

   const exact=s.match(/^\s*(\d{1,5}(?:\.\d{1,2})?)\s*$/);
   if(!exact)return"";
   const v=Number(exact[1]);
   return Number.isFinite(v)&&v>=0&&v<=99999?String(v):"";
 }

 function parseTrocrHours(s){
   s=String(s||"").replace(/[Oo]/g,"0").replace(/,/g,".").trim();

   let m=s.match(/=\s*(\.\d+|\d+(?:\.\d+)?)\s*(?:h|hr|hrs|hour|hours)?\b/i);
   if(!m)m=s.match(/(\.\d+|\d+(?:\.\d+)?)\s*(?:h|hr|hrs|hour|hours)\b/i);

   if(!m){
     const vals=[...s.matchAll(/(?:^|\s)(\.\d+|\d+\.\d+)(?=\s|$)/g)]
       .map(x=>Number(x[1])).filter(v=>Number.isFinite(v)&&v>=0&&v<=20);
     if(vals.length)m=[null,String(vals[vals.length-1])];
   }

   if(!m)return"";
   const v=Number(m[1]);
   return Number.isFinite(v)&&v>=0&&v<=20?String(v):"";
 }

 function parseTrocrTotal(s){
   s=String(s||"").replace(/[Oo]/g,"0").replace(/,/g,".").trim();
   if(/\brecon\b/i.test(s))return{kind:"RECON",value:null};
   if(/\bnote\b/i.test(s))return{kind:"NOTE",value:null};

   const dollar=s.match(/\$\s*(\d{2,6}(?:\.\d{1,2})?)/);
   if(dollar)return{kind:"PRICE",value:Number(dollar[1])};

   const nums=[...s.matchAll(/\b(\d{2,6}(?:\.\d{1,2})?)\b/g)]
     .map(m=>Number(m[1])).filter(v=>Number.isFinite(v)&&v>=5&&v<=999999);
   if(nums.length===1)return{kind:"PRICE",value:nums[0]};
   return{kind:"",value:null};
 }

 function inferHoursFromTotal(total,parts){
   total=Number(total);parts=Number(parts||0);
   if(!Number.isFinite(total)||!Number.isFinite(parts))return"";
   let best=null,bestErr=Infinity;
   const raw=Math.max(0,(total-parts)/RATE);
   // Technicians use values such as .2, .5, 1.48, 2.60, 3.79. Search hundredths.
   for(let n=0;n<=2000;n++){
     const h=n/100;
     if(calc(h,parts)!==total)continue;
     const err=Math.abs(h-raw);
     if(err<bestErr){bestErr=err;best=h;}
   }
   return best==null?"":String(Number(best.toFixed(2)));
 }

 function inferPartsFromTotal(total,hours){
   total=Number(total);hours=Number(hours);
   if(!Number.isFinite(total)||!Number.isFinite(hours))return"";
   let best=null,bestErr=Infinity;
   const raw=Math.max(0,total-hours*RATE);
   // Parts are entered as dollar amounts. Search nearby whole-dollar values and
   // retain only values that reproduce the technician total under our pricing rule.
   const lo=Math.max(0,Math.floor(raw)-8),hi=Math.ceil(raw)+8;
   for(let p=lo;p<=hi;p++){
     if(calc(hours,p)!==total)continue;
     const err=Math.abs(p-raw);
     if(err<bestErr){bestErr=err;best=p;}
   }
   return best==null?"":String(best);
 }

 function cellInkDensity(canvas,x0,y0,x1,y1){
   const sx=Math.floor(x0*canvas.width),sy=Math.floor(y0*canvas.height);
   const sw=Math.max(1,Math.floor((x1-x0)*canvas.width)),sh=Math.max(1,Math.floor((y1-y0)*canvas.height));
   const c=document.createElement("canvas");c.width=sw;c.height=sh;

   ctx.drawImage(canvas,sx,sy,sw,sh,0,0,sw,sh);
   const d=ctx.getImageData(0,0,sw,sh).data;
   let ink=0,total=0;
   for(let y=Math.floor(sh*.18);y<Math.ceil(sh*.82);y++){
     for(let x=Math.floor(sw*.12);x<Math.ceil(sw*.88);x++){

 function rvPlausibility(s){

   const words=(s.toLowerCase().match(/[a-z]+/g)||[]);
   let score=0;

 function remapCropItems(result,meta){
   const W=Number(result?.image?.width)||meta.canvas.width;

     const nx=meta.x0+lx*(meta.x1-meta.x0);
     const ny=meta.y0+ly*(meta.y1-meta.y0);

     if(!ro){
       const nums=items.map(x=>String(x.text||"").replace(/\D/g,""))
         .filter(x=>/^\d{4,6}$/.test(x));
       if(nums.length===1)ro=nums[0];
     }
   }

   let rowGap=medianRowGap(anchors);

   // Find labor-only repairs that have no red parts quote/dash.
   const candidates=missingLaborCandidates(anchors,rowGap);
   if(candidates.length){
     const h0=cols.ro.x1-.062,h1=cols.ro.x1-.004;
     const candidateCrops=candidates.map(y=>
       makeTrocrCrop(canvas,h0,Math.max(.17,y-rowGap*.38),h1,Math.min(.995,y+rowGap*.38),"hours",390)
     );
     const candidateReads=await trocrBatch(candidateCrops,"Checking labor-only repair lines",56,62,24);
     candidateReads.forEach((s,i)=>{
       const h=parseTrocrHours(s);
       if(h&&candidateCrops[i].density>.0008){
         anchors.push({y:candidates[i],red:false,blue:false,laborOnly:true,inferredHours:h,strength:80});
       }
     });
     anchors.sort((a,b)=>a.y-b.y);
     // Do not let an inferred row sit on top of a real color anchor.
     anchors=anchors.filter((a,i,arr)=>i===0||a.y-arr[i-1].y>rowGap*.42||a.red||a.blue);
     rowGap=medianRowGap(anchors);
   }

   const descStart=cols.make.x0+.018;
   const descEnd=cols.ro.x1-.040;
   const partX0=cols.ro.x1-.145,partX1=cols.ro.x1-.058;
   const hourX0=cols.ro.x1-.073,hourX1=cols.ro.x1-.003;
   const totalX0=cols.date.x0,totalX1=cols.date.x1;
   const fixX0=cols.tech.x0,fixX1=(cols.tech.x0+cols.tech.x1)/2;
   const asisX0=fixX1,asisX1=cols.tech.x1;

   const descCrops=[],descSoftCrops=[],descMap=[],partCrops=[],hourCrops=[],totalCrops=[];
   for(let i=0;i<anchors.length;i++){
     const y=anchors[i].y;
     // A repair owns everything after the previous normal row boundary through its
     // quote/status row. This keeps handwritten continuation lines with the repair.
     const prevY=i>0?anchors[i-1].y:null;
     const nextY=i+1<anchors.length?anchors[i+1].y:null;
     const prevGap=prevY==null?rowGap:y-prevY;
     const nextGap=nextY==null?rowGap:nextY-y;

     let top;
     if(prevY==null){
       top=Math.max(.17,y-rowGap*.52);
     }else if(prevGap>rowGap*1.65 && y>.86 && prevY<.86){
       // First repair below the printed form: do not absorb signature/footer text.
       top=Math.max(.17,y-rowGap*.58);
     }else if(prevGap>rowGap*1.65){
       // A large within-table gap can be a multi-line repair. Give the current repair
       // the space after the prior repair's normal row boundary.
       top=Math.max(.17,prevY+rowGap*.52);
     }else{
       // Normal adjacent repairs meet at the midpoint between their anchors.
       top=Math.max(.17,(prevY+y)/2);
     }

     let bottom;
     if(nextY==null){
       bottom=Math.min(.995,y+rowGap*.55);
     }else if(nextGap>rowGap*1.65){
       // Do not let this repair consume a later multi-line block or the footer.
       bottom=Math.min(.995,y+rowGap*.55);
     }else{
       bottom=Math.min(.995,(y+nextY)/2);
     }

     // TrOCR is trained on single handwritten text lines. Split a repair spanning
     // multiple form rows into row-sized images, OCR those separately, then join them.
     const firstDesc=descCrops.length;
     const spanH=Math.max(.001,bottom-top);
     const slices=Math.max(1,Math.ceil(spanH/(rowGap*.92)));
     const sliceH=spanH/slices;
     for(let s=0;s<slices;s++){
       const sy0=top+s*sliceH;
       const sy1=Math.min(bottom,top+(s+1)*sliceH);
       descCrops.push(makeTrocrCrop(canvas,descStart,sy0,descEnd,sy1,"description",1200));
       descSoftCrops.push(makeTrocrCrop(canvas,descStart,sy0,cols.ro.x1-.010,sy1,"descriptionSoft",1200));
     }
     descMap.push({start:firstDesc,count:slices});

     partCrops.push(makeTrocrCrop(canvas,partX0,Math.max(.17,y-rowGap*.38),partX1,Math.min(.995,y+rowGap*.38),"parts",430));
     hourCrops.push(makeTrocrCrop(canvas,hourX0,Math.max(.17,y-rowGap*.38),hourX1,Math.min(.995,y+rowGap*.38),"hours",390));
     totalCrops.push(makeTrocrCrop(canvas,totalX0,Math.max(.17,y-rowGap*.38),totalX1,Math.min(.995,y+rowGap*.38),"total",480));
   }

   const descriptions=await trocrBatch(descCrops,"Reading handwritten repair lines",62,76,82);
   const descriptions2=await trocrBatch(descSoftCrops,"Verifying faint repair lines",76,84,82);
   const partReads=await trocrBatch(partCrops,"Reading parts amounts",84,89,24);
   const hourReads=await trocrBatch(hourCrops,"Reading labor hours",89,93,24);
   const totalReads=await trocrBatch(totalCrops,"Reading RECON / NOTE",93,97,30);

   const jobs=[];
   for(let i=0;i<anchors.length;i++){
     const map=descMap[i]||{start:i,count:1};
     const pieces=[];
     let bestScore=0;
     for(let k=0;k<map.count;k++){
       const di=map.start+k;
       const t1=correctRVText(stripRepairNumbers(descriptions[di]||""));
       const t2=correctRVText(stripRepairNumbers(descriptions2[di]||""));
       const s1=rvPlausibility(t1),s2=rvPlausibility(t2);
       const chosen=s2>s1?t2:t1;
       const chosenScore=Math.max(s1,s2);
       if(chosenScore>0.7&&chosen&&!/^\[/.test(chosen))pieces.push(chosen);
       bestScore+=Math.max(0,chosenScore);
     }
     let title=cleanText(pieces.join(" "));
     const titleLow=!title||bestScore<2.5;
     if(titleLow)title="[HANDWRITING NEEDS REVIEW]";

     let parts=parseTrocrParts(partReads[i]);
     let hours=anchors[i].inferredHours||parseTrocrHours(hourReads[i]);

     if(parts&&Number(parts)<0)parts="";
     if(hours&&Number(hours)>20)hours="";

     const totalInfo=parseTrocrTotal(totalReads[i]);
     let status="PENDING";
     if(totalInfo.kind==="RECON")status="RECON";
     else if(totalInfo.kind==="NOTE")status="NOTE";

     // Use the technician's Total Cost only as a validation signal. Our actual price
     // still comes from quoted parts + quoted hours at $199/hr, rounded up to $5.
     let recoveredHours=false,recoveredParts=false;
     if(totalInfo.kind==="PRICE"&&Number.isFinite(totalInfo.value)){
       if(!hours&&parts){
         const inferred=inferHoursFromTotal(totalInfo.value,parts);
         if(inferred){hours=inferred;recoveredHours=true;}
       }else if(hours&&!parts){
         const inferred=inferPartsFromTotal(totalInfo.value,hours);
         if(inferred){parts=inferred;recoveredParts=true;}
       }
     }

     if(kind==="approval"){
       const y=anchors[i].y;
       const y0=Math.max(.17,y-rowGap*.33),y1=Math.min(.995,y+rowGap*.33);
       const fixInk=cellInkDensity(canvas,fixX0,y0,fixX1,y1);
       const asisInk=cellInkDensity(canvas,asisX0,y0,asisX1,y1);
       if(fixInk>asisInk*1.35&&fixInk>.12)status="APPROVED";
       else if(asisInk>fixInk*1.35&&asisInk>.12)status="DECLINED";
     }

     const issues=[];
     if(titleLow)issues.push("description");
     let hoursLow=(hourCrops[i].density>.0010&&!hours)||recoveredHours;
     let partsLow=(partCrops[i].density>.0010&&!parts)||recoveredParts;

     let totalMismatch="";
     if(totalInfo.kind==="PRICE"&&hours!==""&&parts!==""){
       const computed=calc(hours,parts);
       if(computed!==totalInfo.value){
         hoursLow=true;partsLow=true;
         totalMismatch=`Calculated ${money(computed)} does not match sheet total ${money(totalInfo.value)}.`;
       }
     }

     if(hoursLow)issues.push("labor");
     if(partsLow)issues.push("parts");
     const recoveryNotes=[];
     if(recoveredHours)recoveryNotes.push("Labor was recovered from the written Total Cost; verify the handwritten hours.");
     if(recoveredParts)recoveryNotes.push("Parts were recovered from the written Total Cost; verify the handwritten parts amount.");
     jobs.push({
       num:i+1,status,title,hours,parts,
       confidence:titleLow?.42:.88,
       titleLow,hoursLow,partsLow,
       comment:[
         issues.length?`Verify ${[...new Set(issues)].join(", ")} against photo.`:"",
         ...recoveryNotes,
         totalMismatch
       ].filter(Boolean).join(" ")
     });
   }

   return{
     ro,jobs,
     notes:[
       `${jobs.length} repair${jobs.length===1?"":"s"} detected from quote/RECON anchors plus verified labor-only lines.`,
       `RO was restricted to the fixed RO# header column.`,
       `Multi-line repairs are split into individual handwriting lines before recognition; Total Cost is used only to validate/recover parts or labor, never as the pricing source.`
     ]
   };
 }

 function ensureRO(out){
   const scanned=String(out?.ro||"").trim();
   const current=String(state.ro||"").trim();
   if(scanned && current && scanned!==current){
     const entered=prompt(`RO mismatch. Current field is ${current}; photo reads ${scanned}. Enter the correct RO#:`, current);
     if(!entered||!String(entered).trim())throw new Error("RO# mismatch needs verification. Nothing was added.");
     state.ro=String(entered).trim();ro.value=state.ro;
   }
   if(scanned && !current){
     if(scanned.length>6){
       const entered=prompt(`RO# read as ${scanned}, which may be Stock#. Enter the correct RO#:`);
       if(!entered||!String(entered).trim())throw new Error("RO# needs verification. Nothing was added.");
       state.ro=String(entered).trim();
     }else{
       state.ro=scanned;
     }
     ro.value=state.ro;banner.style.display="none";
     if(conn&&conn.open)conn.send({type:"ro",ro:state.ro});
     return;
   }
   if(!scanned && !current){
     const entered=prompt("RO# was not read confidently. Enter the RO#:");
     if(!entered||!String(entered).trim())throw new Error("RO# is required. Nothing was added.");
     state.ro=String(entered).trim();ro.value=state.ro;banner.style.display="none";
     if(conn&&conn.open)conn.send({type:"ro",ro:state.ro});
   }
 }

 function reconcileApproval(incoming){
   const existing=Array.isArray(state.jobs)?state.jobs:[];
   if(!existing.length)return false;

   // Same URR form: anchor order is the strongest relationship between quote and approval.
   if(incoming.length===existing.length){
     let changed=0;
     for(let i=0;i<existing.length;i++){
       const s=String(incoming[i]?.status||"PENDING").toUpperCase();
       if(["APPROVED","DECLINED","RECON","NOTE"].includes(s)){
         existing[i].status=s;changed++;
       }
       if(Number(incoming[i]?.confidence)<Number(existing[i]?.confidence??1)){
         existing[i].confidence=Number(incoming[i].confidence);
         if(incoming[i]?.comment)existing[i].comment=incoming[i].comment;
       }
     }
     if(changed)return true;
   }

   // Count changed or OCR missed an anchor: fall back to title + position matching.
   const used=new Set();let matched=0;
   for(let ai=0;ai<incoming.length;ai++){
     const a=incoming[ai];let best=-1,bestScore=0;
     for(let i=0;i<existing.length;i++){
       if(used.has(i))continue;
       let score=titleSimilarity(a?.title,existing[i]?.title);
       if(ai===i)score+=.25;
       if(String(a?.hours||"")&&String(a.hours)===String(existing[i]?.hours||""))score+=.08;
       if(String(a?.parts||"")&&String(a.parts)===String(existing[i]?.parts||""))score+=.08;
       if(score>bestScore){bestScore=score;best=i;}
     }
     if(best>=0&&bestScore>=.30){
       const j=existing[best];used.add(best);matched++;
       const s=String(a?.status||"PENDING").toUpperCase();
       if(["APPROVED","DECLINED","RECON","NOTE"].includes(s))j.status=s;
     }
   }
   if(!matched)throw new Error("Approval photo did not line up with the loaded quote. Nothing was changed.");
   return true;
 }

 const id="urr-"+(crypto.randomUUID?crypto.randomUUID().replace(/-/g,"").slice(0,20):(Date.now()+Math.random().toString(16).slice(2)));
 const pairUrl=`${location.origin}${location.pathname}?mode=phone&peer=${encodeURIComponent(id)}&v=urr-r15&cb=${Date.now()}`;
 if(typeof QRCode!=="undefined"){
   try{
     q.innerHTML="";
     new QRCode(q,{text:pairUrl,width:220,height:220,correctLevel:QRCode.CorrectLevel.M});
   }catch(e){console.error(e);}
 }
 if(!q.querySelector("img")&&!q.querySelector("canvas")){
   q.innerHTML="QR failed to render";
   const fb=document.getElementById("pairFallback");
   fb.style.display="block";
   fb.innerHTML=`<a href="${pairUrl}" target="_blank">Open phone pairing link</a>`;
 }
 if(typeof Peer==="undefined"){
   ds.textContent="Pairing library blocked";
   ds.className="status error";
 }else{
   peer=new Peer(id);
   peer.on("open",()=>{
     ds.textContent="Waiting for phone";
   });
   peer.on("connection",c=>{
     conn=c;
     c.on("open",()=>{
       ds.textContent="Phone connected";
       ds.className="status connected";
       conn.send({type:"ro",ro:state.ro});
     });
     c.on("data",d=>{
       if(!d)return;
       if(d.type==="photo"){
         analyzePhoto(d.kind,d.sourceImage);
         ds.textContent="Photo received — reading handwriting";
         ds.className="status sync";
       }
     });
     c.on("close",()=>{
       ds.textContent="Phone disconnected";
       ds.className="status";
     });
     c.on("error",e=>{
       console.error(e);
       ds.textContent="Phone connection error";
       ds.className="status error";
     });
   });
   peer.on("error",e=>{
     console.error(e);
     ds.textContent=`Pairing error${e?.type?": "+e.type:""}`;
     ds.className="status error";
   });
 }
 function apply(kind,out){
   ensureRO(out);

   if(kind==="quote"){
     const incoming=Array.isArray(out?.jobs)?out.jobs:[];
     if(!incoming.length)throw new Error("No repair jobs were read from the quote photo.");
     const startNum=Array.isArray(state.jobs)?state.jobs.length:0;
     const mapped=incoming.map((j,i)=>({
       num:startNum+i+1,
       // Quote dollars/labor do NOT make something RECON. Only an explicit read does.
       status:["RECON","NOTE"].includes(String(j?.status||"").toUpperCase())?String(j.status).toUpperCase():"PENDING",
       title:String(j?.title||""),
       hours:j?.hours==null?"":String(j.hours),
       parts:j?.parts==null?"":String(j.parts),
       confidence:Number.isFinite(Number(j?.confidence))?Number(j.confidence):0.55,
       titleLow:!!j?.titleLow,hoursLow:!!j?.hoursLow,partsLow:!!j?.partsLow,
       comment:String(j?.comment||"")
     }));
     state.jobs=[...(Array.isArray(state.jobs)?state.jobs:[]),...mapped];
     state.sheetCount=(Number(state.sheetCount)||0)+1;
     state.notes=[...(state.notes||[]),`Quote sheet ${state.sheetCount}: ${(out?.notes||[]).join(" ")}`];
   }else{
     const incoming=Array.isArray(out?.jobs)?out.jobs:[];
     if(!incoming.length)throw new Error("No repair jobs were read from the approval photo.");

     if(!Array.isArray(state.jobs)||!state.jobs.length){
       // Approval-only workflow: the approval sheet becomes the source document.
       // This is valid when the original quote was never scanned.
       state.jobs=incoming.map((j,i)=>({
         num:Number(j?.num)||i+1,
         status:["APPROVED","DECLINED","RECON","NOTE","PENDING"].includes(String(j?.status||"").toUpperCase())
           ?String(j.status).toUpperCase()
           :"PENDING",
         title:String(j?.title||""),
         hours:j?.hours==null?"":String(j.hours),
         parts:j?.parts==null?"":String(j.parts),
         confidence:Number.isFinite(Number(j?.confidence))?Number(j.confidence):0.55,
         titleLow:!!j?.titleLow,
         hoursLow:!!j?.hoursLow,
         partsLow:!!j?.partsLow,
         comment:String(j?.comment||"")
       }));
       state.sheetCount=1;
       state.notes=[
         "Approval-only workflow: no quote photo was loaded; jobs were created directly from the approval sheet.",
         ...(Array.isArray(out?.notes)?out.notes.map(String):[])
       ];
     }else{
       reconcileApproval(incoming);
       state.notes=[...(state.notes||[]),...(Array.isArray(out?.notes)?out.notes.map(String):[])];
     }
   }

   render();
 }

 async function analyzePhoto(kind,imageData){
   currentPhoto={kind,imageData};
   sourceWrap.style.display="block";
   const thumb=document.createElement("img");
   thumb.src=imageData;
   thumb.alt=kind==="approval"?"Approval sheet":"URR sheet";
   sourceGallery.appendChild(thumb);
   try{
     const img=await loadImg(imageData),paper=detectPaperRect(img);
     const result=await analyzePage(kind,img,paper);
     const count=result.jobs.length;
     apply(kind,result);
     const rendered=document.querySelectorAll("#jobs .job").length;
     setAIProgress(100,
       kind==="quote"
         ?`Quote sheet ${state.sheetCount}: ${count} repair${count===1?"":"s"} added. ${rendered} total loaded.`
         :`${state.sheetCount===1&&state.notes?.[0]?.startsWith("Approval-only workflow") ? "Approval sheet loaded" : "Approval reconciled"}. ${rendered} repair${rendered===1?"":"s"} loaded.`,
       "ready"
     );
     if(conn&&conn.open)conn.send({type:"analysis_done",ro:state.ro||""});
     ds.textContent="Updated from phone";ds.className="status sync";
     setTimeout(()=>{if(conn&&conn.open){ds.textContent="Phone connected";ds.className="status connected";}},1200);
   }catch(e){
     console.error(e);
     setAIProgress(parseInt(aiProgress.style.width)||5,"URR read stopped: "+(e?.message||String(e)),"error");
     if(conn&&conn.open)conn.send({type:"analysis_error",message:e?.message||String(e)});
   }
 }

 function copyText(t,el){navigator.clipboard.writeText(t).then(()=>el.textContent="Copied");}
 function render(){
   const box=document.getElementById("jobs");
   box.innerHTML="";
   const list=Array.isArray(state.jobs)?state.jobs:[];
   list.forEach((j,idx)=>{
     try{
       const d=document.createElement("div");d.className="job"+((j.confidence??1)<.82?" low":"");d.innerHTML=`<input class="num" type="number" value="${esc(j.num)}"><select class="status"><option>PENDING</option><option>APPROVED</option><option>DECLINED</option><option>RECON</option><option>NOTE</option></select><input class="title${j.titleLow?" field-low":""}" value="${esc(j.title)}"><input class="hours${j.hoursLow?" field-low":""}" placeholder="Hours" value="${esc(j.hours)}"><input class="parts${j.partsLow?" field-low":""}" placeholder="Parts $" value="${esc(j.parts)}"><div class="price">${money(calc(j.hours,j.parts))}</div><div class="actions"><button class="btn copy small cj">Copy Job</button><button class="btn secondary small cl">Copy Labor</button><span class="copied"></span></div>${j.comment?`<div class="comment">${esc(j.comment)}</div>`:""}`;
       d.querySelector(".status").value=j.status||"PENDING";
       for(const f of ["num","status","title","hours","parts"]){
         d.querySelector("."+f).addEventListener("change",e=>{
           j[f]=e.target.value;if(f==="num")j[f]=Number(e.target.value)||"";
           if(f==="title")j.titleLow=false;if(f==="hours")j.hoursLow=false;if(f==="parts")j.partsLow=false;
           render();
         });
       }
       d.querySelector(".cj").onclick=()=>{
         const marker=d.querySelector(".copied");
         if(!state.ro){banner.style.display="block";ro.focus();marker.textContent="RO required";return;}
         const s=j.status||"PENDING";
         if(s==="PENDING"){marker.textContent="Set status first";return;}
         if(j.titleLow||j.hoursLow||j.partsLow){marker.textContent="Review orange fields";return;}
         const total=calc(j.hours,j.parts);
         if(s==="APPROVED"&&total==null){marker.textContent="Price missing";return;}
         const pre=s==="APPROVED"?`(APPROVED ${money(total)})`:`(${s})`;
         copyText(`${pre} ${j.num}. ${String(j.title||"").toUpperCase()}`,marker);
       };
       d.querySelector(".cl").onclick=()=>{
         const marker=d.querySelector(".copied");
         if(j.status!=="APPROVED"){marker.textContent="Not approved";return;}
         if(j.hoursLow){marker.textContent="Review labor";return;}
         if(String(j.hours??"")===""){marker.textContent="No labor";return;}
         copyText(String(j.hours),marker);
       };
       box.appendChild(d);
     }catch(e){
       console.error("Could not render OCR row",idx+1,e,j);
       const err=document.createElement("div");
       err.className="banner";
       err.style.display="block";
       err.textContent=`Row ${idx+1} was read but could not be displayed: ${e.message||e}`;
       box.appendChild(err);
     }
   });
   document.getElementById("notes").textContent=(state.notes||[]).join(" • ");
 }
 ro.addEventListener("input",()=>{state.ro=ro.value.trim();banner.style.display=state.ro?"none":"block";if(conn&&conn.open)conn.send({type:"ro",ro:state.ro})});
 document.getElementById("morePages").onclick=()=>{
   if(!conn||!conn.open){
     aiStatus.textContent="Phone is not connected. Scan the QR before adding another page.";
     aiStatus.className="ai-status error";
     return;
   }
   conn.send({type:"request_additional_page",ts:Date.now()});
   aiStatus.textContent="Phone is ready for the next URR page. Existing pages and extracted jobs are being kept.";
   aiStatus.className="ai-status ready";
   aiProgressLabel.textContent="Waiting for next page photo.";
 };
 render();
}
if(phoneMode)phoneApp();else desktopApp();
