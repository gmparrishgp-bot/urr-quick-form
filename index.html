s:center}.copied{font-size:11px;color:#147a3f;font-weight:700}.comment{grid-column:1/-1;color:#8a6200;font-size:12px}.source img{max-width:100%;max-height:360px;border-radius:8px;border:1px solid #d8dee9}.ai-status{padding:10px 12px;border-radius:8px;background:#eef2f6;margin:10px 0;font-weight:700}.ai-status.ready{background:#dff7e8;color:#147a3f}.ai-status.error{background:#fee4e2;color:#b42318}.progress-wrap{height:14px;background:#e4e7ec;border-radius:999px;overflow:hidden;margin:8px 0 4px}.progress-bar{height:100%;width:0%;background:#175cd3;transition:width .25s ease}.progress-label{font-size:12px;color:#667085}.phone{max-width:520px;margin:0 auto;padding:22px}.phone h1{text-align:center}.big{display:block;width:100%;font-size:22px;padding:22px;margin:18px 0;border:0;border-radius:14px;font-weight:800;color:#fff;background:#172033;text-align:center}.big.approval{background:#0b6bcb}.phone input[type=file]{display:none}.msg{padding:12px;border-radius:10px;background:#eef2f6;margin-top:12px;text-align:center}.msg.connected{background:#dff7e8;color:#147a3f}.msg.error{background:#fee4e2;color:#b42318}.retry-link{display:block;margin-top:10px;font-weight:800;text-decoration:underline;cursor:pointer;color:#175cd3}.spinner{display:inline-block;width:16px;height:16px;border:2px solid #ddd;border-top-color:#172033;border-radius:50%;animation:spin .8s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}@media(max-width:900px){.grid{grid-template-columns:1fr}.job{grid-template-columns:60px 100px 1fr 80px 90px}.price{grid-column:1/3}.actions{grid-column:3/-1}}@media(max-width:620px){.wrap{padding:10px}.brand{font-size:22px}}

<body><div id="app"></div>
<script>
"use strict";
const RATE=199;
const qs=new URLSearchParams(location.search);
const phoneMode=qs.get("mode")==="phone" && qs.get("peer");

function esc(v){return String(v??"").replace(/[&<>'"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","'":"&#39;",'"':"&quot;"}[c]));}
function calc(h,p){h=parseFloat(h);p=parseFloat(p);if(Number.isNaN(h)&&Number.isNaN(p))return null;return Math.ceil((((Number.isNaN(h)?0:h*RATE)+(Number.isNaN(p)?0:p))/5))*5;}
function money(v){return v==null?"—":"$"+Number(v).toLocaleString("en-US",{maximumFractionDigits:0});}
function normalized(t){return String(t||"").replace(/curb\s*side|door\s*side/gi,"DS").replace(/driver\s*side|off\s*door\s*side/gi,"ODS").replace(/wheel\s*bearing\s*pack/gi,"WBP").replace(/\s+/g," ").trim();}
function findRO(t){for(const p of [/\bRO\s*(?:#|NO\.?|NUMBER)?\s*[:#-]?\s*(\d{4,8})\b/i,/\bREPAIR\s+ORDER\s*[:#-]?\s*(\d{4,8})\b/i,/\bWO\s*[:#-]?\s*(\d{4,8})\b/i]){const m=t.match(p);if(m)return m[1]}return "";}
function hours(line){for(const p of [/\b(?:LABOR|LAB|HRS?|HOURS?)\s*[:=-]?\s*(\.?\d+(?:\.\d+)?)\b/i,/\b(\d+(?:\.\d+)?)\s*(?:HRS?|HOURS?)\b/i]){const m=line.match(p);if(m)return m[1].replace(/^\./,"0.")}return "";}
function parts(line){for(const p of [/\b(?:PARTS?|PTS?)\s*[:=-]?\s*\$?\s*(\d+(?:\.\d{1,2})?)/i,/\$\s*(\d+(?:\.\d{1,2})?)/]){const m=line.match(p);if(m)return m[1]}return "";}
function strip(line){return normalized(line.replace(/\b(?:LABOR|LAB|HRS?|HOURS?|PARTS?|PTS?)\b\s*[:=-]?\s*\$?\s*\.?\d+(?:\.\d+)?/gi," ").replace(/\$\s*\d+(?:\.\d+)?/g," ").replace(/\b\d+(?:\.\d+)?\s*(?:HRS?|HOURS?)\b/gi," "));}
function parseQuote(text){
 const lines=text.replace(/\r/g,"").split("\n").map(x=>x.trim()).filter(Boolean),jobs=[];let pending="";
 for(const raw of lines){let line=normalized(raw);if(line.length<3||/^(RO|REPAIR ORDER|CUSTOMER|VIN|STOCK|DATE|TECH|TECHNICIAN)\b/i.test(line))continue;
 const nm=line.match(/^\s*(\d{1,2})[.)-]?\s+(.+)/);let num="",body=line;if(nm){num=nm[1];body=nm[2]}
 const h=hours(line),p=parts(line),meaning=/[A-Za-z]{3,}/.test(body);
 if((h||p)&&meaning){let title=strip(body).replace(/^[-:]+|[-:]+$/g,"").trim();if(pending){title=(pending+" "+title).trim();pending=""}jobs.push({num:num||jobs.length+1,title:title||"REVIEW TECH DESCRIPTION",hours:h,parts:p,status:"PENDING",confidence:.7,comment:"Browser-read result — verify handwriting."});}
 else if(num&&meaning){pending=body;} else if(meaning&&line.length>12){pending=pending?pending+" "+line:line;}
 }
 if(!jobs.length){lines.filter(x=>/[A-Za-z]{4,}/.test(x)).slice(0,12).forEach((x,i)=>jobs.push({num:i+1,title:strip(x),hours:hours(x),parts:parts(x),status:"PENDING",confidence:.45,comment:"Low-confidence browser read."}));}
 return {ro:findRO(text),jobs,notes:["Local browser OCR used. Verify flagged fields before DMS copy."]};
}
function parseApproval(text){
 const lines=text.replace(/\r/g,"").split("\n").map(normalized).filter(Boolean),jobs=[];let last="";
 for(const line of lines){const nm=line.match(/^\s*(\d{1,2})[.)-]?\s+/);if(nm)last=nm[1];let s="";if(/\b(?:FIX|APPROVE[DS]?|APPROVED|YES)\b/i.test(line))s="APPROVED";else if(/\b(?:AS\s*IS|DECLINE[DS]?|DECLINED|NO)\b/i.test(line))s="DECLINED";else if(/\bRECON\b/i.test(line))s="RECON";else if(/\bNOTE\b/i.test(line))s="NOTE";if(s)jobs.push({num:last||jobs.length+1,status:s,title:strip(line)});}
 return {ro:findRO(text),jobs,notes:jobs.length?[]:["Approval marks were not read confidently. Review statuses."]};
}
async function compress(file,max=1280,q=.86){return new Promise((res,rej)=>{const r=new FileReader(),img=new Image();r.onerror=rej;r.onload=()=>img.src=r.result;img.onload=()=>{let w=img.width,h=img.height,s=Math.min(1,max/Math.max(w,h));w=Math.round(w*s);h=Math.round(h*s);const c=document.createElement("canvas");c.width=w;c.height=h;c.getContext("2d").drawImage(img,0,0,w,h);res(c.toDataURL("image/jpeg",q));};r.readAsDataURL(file);});}
async function analyze(data,kind,progress){if(typeof Tesseract==="undefined")throw new Error("Photo reader did not load.");const r=await Tesseract.recognize(data,"eng",{logger:m=>{if(m.status==="recognizing text")progress(Math.round((m.progress||0)*100))}});const text=r.data.text||"";if(!text.trim())throw new Error("No readable text found. Retake closer.");return kind==="approval"?parseApproval(text):parseQuote(text);}

function phoneApp(){
 const host=qs.get("peer");
 app.innerHTML=`<div class="phone"><h1>URR Quick Form</h1><div id="pstatus" class="msg">Connecting to computer…</div><label class="big" for="quote">TAKE QUOTE PHOTO</label><input id="quote" type="file" accept="image/*" capture="environment"><label class="big approval" for="approval">TAKE APPROVAL PHOTO</label><input id="approval" type="file" accept="image/*" capture="environment"><div id="pmsg" class="msg">Waiting for connection.</div></div>`;
 const ps=document.getElementById("pstatus"),pm=document.getElementById("pmsg");
 function setPhoneConnectionError(message){
   ps.className="msg error";
   ps.innerHTML=`${message}<span id="rescanBanner" class="retry-link">Tap here to scan the QR again</span>`;
   const b=document.getElementById("rescanBanner");
   if(b){
     b.onclick=()=>{
       // There is no standards-based browser API that can reopen the system QR scanner directly.
       // Best browser-only behavior: return to the base page so the user can use the phone camera to rescan.
       location.href=location.origin+location.pathname+"?rescan="+Date.now();
     };
   }
 }

 if(typeof Peer==="undefined"){setPhoneConnectionError("Pairing library did not load.");return;}
 const peer=new Peer();let conn=null,attempts=0,retryTimer=null;
 function connectToComputer(){
   if(conn&&conn.open)return;
   attempts++;
   ps.textContent=attempts===1?"Connecting to computer…":`Connecting to computer… attempt ${attempts}`;
   conn=peer.connect(host,{reliable:true});
   let opened=false;
   conn.on("open",()=>{opened=true;if(retryTimer)clearTimeout(retryTimer);ps.textContent="Connected to computer";ps.className="msg connected";pm.textContent="Ready to take a photo.";conn.send({type:"refresh",reason:"phone_connected",ts:Date.now()});setInterval(()=>{if(conn&&conn.open)conn.send({type:"heartbeat",ts:Date.now()});},5000);});
   conn.on("data",d=>{
     if(!d)return;
     if(d.type==="ro"){pm.textContent=d.ro?`RO #${d.ro}`:"Ready to take a photo.";}
     else if(d.type==="ai_progress"){
       const pct=Number.isFinite(d.percent)?` ${d.percent}%`:"";
       pm.textContent=(d.message||"Computer is analyzing the photo…")+pct;
       pm.className="msg";
     }else if(d.type==="analysis_done"){
       pm.textContent=d.ro?`Analysis complete — RO #${d.ro}`:"Analysis complete. RO was not read confidently; review it on the computer.";
       pm.className="msg connected";
     }else if(d.type==="analysis_error"){
       pm.textContent="Computer could not finish the read. Review the message on the computer.";
       pm.className="msg error";
     }
   });
   conn.on("error",e=>{console.error(e);});
   conn.on("close",()=>{if(!opened&&attempts<15)retryTimer=setTimeout(connectToComputer,2000);});
   retryTimer=setTimeout(()=>{if(!opened&&attempts<15){try{conn.close()}catch{}connectToComputer()}else if(!opened){setPhoneConnectionError("Could not connect to computer.");}},2500);
 }
 peer.on("open",connectToComputer);
 peer.on("error",e=>{console.error(e);if(attempts>=15){setPhoneConnectionError("Could not connect to computer.");}});
 for(const kind of ["quote","approval"]){
  document.getElementById(kind).addEventListener("change",async ev=>{
    const f=ev.target.files[0];
    if(!f)return;
    if(!conn||!conn.open){pm.textContent="Phone is not connected to the computer.";pm.className="msg error";return;}
    try{
      pm.innerHTML='<span class="spinner"></span> Sending photo to computer…';
      const data=await compress(f,2600,.94);
      conn.send({type:"photo",kind,sourceImage:data,ts:Date.now()});
      conn.send({type:"refresh",reason:kind+"_photo_sent",ts:Date.now()});
      pm.textContent=`${kind==="quote"?"Quote":"Approval"} photo sent. Computer is analyzing the whole sheet, including the RO. Keep this page open.`;
      pm.className="msg connected";
    }catch(e){
      pm.textContent=e.message||"Could not send photo";
      pm.className="msg error";
    }finally{
      ev.target.value="";
    }
  });
}
}

function desktopApp(){
 let state;try{state=JSON.parse(localStorage.getItem("urr_state"))||{ro:"",jobs:[],notes:[]}}catch{state={ro:"",jobs:[],notes:[]}}
 window.state=state;
 app.innerHTML=`<div class="wrap"><div class="top"><div><div class="brand">URR Quick Form</div><div class="muted">Phone capture → computer review → DMS copy • BUILD 18 • FORM-SPECIFIC HANDWRITING • LIVE SYNC</div></div><span id="dstatus" class="status">Waiting for phone</span></div><div class="grid"><div class="card qrbox"><h3>Pair Phone</h3><div id="qr" class="qr">Creating QR…</div><div id="pairFallback" style="display:none"></div><p class="muted">Scan this QR with the phone camera.</p><div class="ro-row"><b>RO#</b><input id="ro" placeholder="Required" value="${esc(state.ro)}"></div><div id="roBanner" class="banner">RO# is required.</div><div class="toolbar"><button id="add" class="btn secondary">+ Add Job</button><button id="clear" class="btn secondary">New URR</button></div></div><div class="card"><div><b>Jobs</b> <span class="muted">Verify bad handwriting reads before copying.</span></div><div id="aiStatus" class="ai-status">Form-specific handwriting reader loads automatically on the first photo.</div><div class="progress-wrap"><div id="aiProgress" class="progress-bar"></div></div><div id="aiProgressLabel" class="progress-label">Waiting for photo.</div><div id="sourceWrap" class="source" style="display:none;margin:12px 0"><b>Source photo</b><br><img id="sourceImg"></div><div id="jobs" class="jobs"></div><div id="notes" class="muted" style="margin-top:12px"></div></div></div></div>`;
 const ds=document.getElementById("dstatus"),q=document.getElementById("qr"),ro=document.getElementById("ro"),banner=document.getElementById("roBanner"),sourceWrap=document.getElementById("sourceWrap"),sourceImg=document.getElementById("sourceImg");
 const aiStatus=document.getElementById("aiStatus"),aiProgress=document.getElementById("aiProgress"),aiProgressLabel=document.getElementById("aiProgressLabel");
 let hf=null,ocr=null,aiLoading=null,currentPhoto=null;
 const ROW_COUNT=17;

 function setAIProgress(percent,message,cls=""){
   const pct=Math.max(0,Math.min(100,Number(percent)||0));
   aiProgress.style.width=pct+"%";
   aiProgressLabel.textContent=message||"";
   aiStatus.textContent=message||"";
   aiStatus.className="ai-status"+(cls?" "+cls:"");
   if(conn&&conn.open)conn.send({type:"ai_progress",message:message||"",percent:pct});
 }

 async function ensureHandwritingModel(){
   if(ocr)return;
   if(aiLoading)return aiLoading;
   aiLoading=(async()=>{
     setAIProgress(3,"Loading specialized handwriting reader…");
     hf=await import("https://cdn.jsdelivr.net/npm/@huggingface/transformers@3.8.1");
     const {pipeline}=hf;
     ocr=await pipeline("image-to-text","Xenova/trocr-small-handwritten",{
       device:"wasm",
       dtype:"q8",
       progress_callback:x=>{
         if(x&&x.status==="progress"&&Number.isFinite(x.progress)){
           const pct=5+Math.round(x.progress*.45);
           setAIProgress(Math.min(50,pct),`Loading handwriting model… ${Math.round(x.progress)}%`);
         }
       }
     });
     setAIProgress(51,"Handwriting model ready.","ready");
   })().catch(e=>{aiLoading=null;throw e;});
   return aiLoading;
 }

 function loadImg(src){
   return new Promise((resolve,reject)=>{
     const im=new Image();
     im.onload=()=>resolve(im);
     im.onerror=()=>reject(new Error("Could not open the URR photo."));
     im.src=src;
   });
 }

 function detectPaperRect(img){
   const max=560, s=Math.min(1,max/Math.max(img.naturalWidth,img.naturalHeight));
   const c=document.createElement("canvas");
   c.width=Math.max(1,Math.round(img.naturalWidth*s));
   c.height=Math.max(1,Math.round(img.naturalHeight*s));
   const ctx=c.getContext("2d",{willReadFrequently:true});
   ctx.drawImage(img,0,0,c.width,c.height);
   const d=ctx.getImageData(0,0,c.width,c.height).data;
   const xs=[],ys=[];
   for(let y=0;y<c.height;y+=2){
     for(let x=0;x<c.width;x+=2){
       const i=(y*c.width+x)*4,r=d[i],g=d[i+1],b=d[i+2];
       const lum=(r+g+b)/3,spread=Math.max(r,g,b)-Math.min(r,g,b);
       if(lum>145 && spread<82){xs.push(x);ys.push(y);}
     }
   }
   if(xs.length<500)return {x:0,y:0,w:img.naturalWidth,h:img.naturalHeight};
   xs.sort((a,b)=>a-b);ys.sort((a,b)=>a-b);
   const q=(a,p)=>a[Math.max(0,Math.min(a.length-1,Math.floor(a.length*p)))];
   let x0=q(xs,.02)/s,x1=q(xs,.98)/s,y0=q(ys,.02)/s,y1=q(ys,.98)/s;
   // Keep detection sane. If the "paper" estimate is too small, use the whole photo.
   if((x1-x0)<img.naturalWidth*.48 || (y1-y0)<img.naturalHeight*.55){
     return {x:0,y:0,w:img.naturalWidth,h:img.naturalHeight};
   }
   const px=(x1-x0)*.015,py=(y1-y0)*.012;
   return {x:Math.max(0,x0-px),y:Math.max(0,y0-py),
           w:Math.min(img.naturalWidth,x1-x0+2*px),
           h:Math.min(img.naturalHeight,y1-y0+2*py)};
 }

 function rowBox(i){
   const top=.385,bottom=.875;
   const h=(bottom-top)/ROW_COUNT;
   return {y0:top+i*h+h*.12,y1:top+(i+1)*h-h*.12};
 }

 function makeCrop(img,paper,nx0,ny0,nx1,ny1,mode="black",targetW=720){
   const sx=paper.x+paper.w*nx0, sy=paper.y+paper.h*ny0;
   const sw=paper.w*(nx1-nx0), sh=paper.h*(ny1-ny0);
   const scale=Math.min(4,targetW/Math.max(1,sw));
   const c=document.createElement("canvas");
   c.width=Math.max(40,Math.round(sw*scale));
   c.height=Math.max(32,Math.round(sh*scale*1.9));
   const ctx=c.getContext("2d",{willReadFrequently:true});
   ctx.fillStyle="#fff";ctx.fillRect(0,0,c.width,c.height);
   ctx.drawImage(img,sx,sy,sw,sh,0,Math.round(c.height*.18),c.width,Math.round(c.height*.64));
   const im=ctx.getImageData(0,0,c.width,c.height),d=im.data;
   let ink=0;
   for(let i=0;i<d.length;i+=4){
     const r=d[i],g=d[i+1],b=d[i+2],mx=Math.max(r,g,b),mn=Math.min(r,g,b);
     const lum=(r+g+b)/3, spread=mx-mn;
     let keep=false;
     if(mode==="red"){
       keep=r>85 && r>g*1.18 && r>b*1.10 && (r-g)>18;
     }else if(mode==="blue"){
       keep=b>65 && (b-r)>8 && (b-g)>3 && spread>12;
     }else{
       // Neutral/black handwriting. Colored parts and purple totals are suppressed.
       keep=lum<170 && spread<48;
     }
     if(keep){d[i]=d[i+1]=d[i+2]=0;ink++;}
     else{d[i]=d[i+1]=d[i+2]=255;}
     d[i+3]=255;
   }
   ctx.putImageData(im,0,0);
   return {url:c.toDataURL("image/png"),density:ink/(c.width*c.height),canvas:c};
 }

 function cleanText(s){
   return String(s||"")
     .replace(/[|_]{2,}/g," ")
     .replace(/\s+/g," ")
     .replace(/\s+([.,])/g,"$1")
     .trim();
 }

 function normalizeRV(s){
   s=cleanText(s);
   const reps=[
     [/\boff\s*door\s*side\b/ig,"ODS"],[/\bdoor\s*side\b/ig,"DS"],
     [/\bwheel\s*bearing\s*pack\b/ig,"WBP"],[/\bl\.?\s*p\.?\b/ig,"LP"],
     [/\ba\/c\b/ig,"A/C"],[/\bwaterheater\b/ig,"water heater"],
     [/\brefrig(?:erator)?\b/ig,"refrigerator"],[/\bcompartment\b/ig,"compartment"],
     [/\bawning\b/ig,"awning"],[/\bconvertor\b/ig,"converter"]
   ];
   for(const [a,b] of reps)s=s.replace(a,b);
   return s;
 }

 function numberFromOCR(s,kind){
   let x=String(s||"").replace(/O/gi,"0").replace(/,/g,".");
   x=x.replace(/[^\d.]/g,"");
   if(!x)return "";
   const m=x.match(/\d*\.\d+|\d+/);
   if(!m)return "";
   let n=m[0];
   if(n.startsWith("."))n="0"+n;
   if(kind==="parts"){
     const v=Number(n);
     return Number.isFinite(v)?String(v):"";
   }
   const v=Number(n);
   if(!Number.isFinite(v) || v>30)return "";
   return String(v);
 }

 async function readBatches(crops,label,p0,p1){
   const out=[];
   const active=crops.map((c,i)=>({c,i})).filter(x=>x.c.density>.0018);
   const total=Math.max(1,active.length);
   for(let k=0;k<active.length;k+=6){
     const batch=active.slice(k,k+6);
     const pct=p0+(p1-p0)*(k/total);
     setAIProgress(pct,`${label} ${Math.min(k+1,total)}–${Math.min(k+batch.length,total)} of ${total}…`);
     let r=await ocr(batch.map(x=>x.c.url),{max_new_tokens:60});
     if(!Array.isArray(r))r=[r];
     // Some pipeline versions wrap batched outputs one level deeper.
     r=r.map(v=>Array.isArray(v)?v[0]:v);
     batch.forEach((x,j)=>out[x.i]=cleanText(r[j]?.generated_text||""));
     await new Promise(res=>setTimeout(res,0));
   }
   return out;
 }

 function cropInkDensity(img,paper,nx0,ny0,nx1,ny1){
   return makeCrop(img,paper,nx0,ny0,nx1,ny1,"black",260).density;
 }

 function headerROCrop(img,paper){
   // Header RO# box on Bish's fixed URR form.
   return makeCrop(img,paper,.385,.215,.555,.305,"black",500);
 }

 function buildQuoteCrops(img,paper){
   const title=[],parts=[],hours=[],total=[];
   for(let i=0;i<ROW_COUNT;i++){
     const r=rowBox(i);
     // Fixed Bish's URR layout: description | total | fix | as-is | SM/GM
     title.push(makeCrop(img,paper,.095,r.y0,.475,r.y1,"black",850));
     parts.push(makeCrop(img,paper,.39,r.y0,.515,r.y1,"red",360));
     hours.push(makeCrop(img,paper,.475,r.y0,.575,r.y1,"black",320));
     total.push(makeCrop(img,paper,.575,r.y0,.705,r.y1,"blue",360));
   }
   return {title,parts,hours,total};
 }

 async function analyzeQuote(img,paper){
   const roCrop=headerROCrop(img,paper);
   setAIProgress(52,"Reading RO number…");
   const roRead=roCrop.density>.0015 ? await ocr(roCrop.url,{max_new_tokens:24}) : null;
   const roText=cleanText((Array.isArray(roRead)?roRead[0]:roRead)?.generated_text||"");
   const ro=(roText.match(/\d{5,7}/)||[])[0]||"";

   const c=buildQuoteCrops(img,paper);
   const titles=await readBatches(c.title,"Reading repair descriptions",55,76);
   const parts=await readBatches(c.parts,"Reading parts amounts",76,85);
   const hours=await readBatches(c.hours,"Reading labor hours",85,92);
   const totals=await readBatches(c.total,"Checking RECON / totals",92,97);

   const jobs=[];
   for(let i=0;i<ROW_COUNT;i++){
     const density=c.title[i].density+c.parts[i].density+c.hours[i].density+c.total[i].density;
     if(density<.0032 && !titles[i])continue;
     let title=normalizeRV(titles[i]||"");
     const p=numberFromOCR(parts[i],"parts");
     const h=numberFromOCR(hours[i],"hours");
     const t=cleanText(totals[i]||"");
     let status=/recon/i.test(t)?"RECON":"PENDING";
     // A row with visible writing but no credible title is still retained and flagged.
     if(!title && density>.004)title="[HANDWRITING NEEDS REVIEW]";
     let confidence=.9;
     const issues=[];
     if(!title || title.startsWith("[")){confidence=.45;issues.push("description");}
     if(c.parts[i].density>.002 && !p){confidence=Math.min(confidence,.62);issues.push("parts");}
     if(c.hours[i].density>.002 && !h){confidence=Math.min(confidence,.62);issues.push("labor");}
     if(title.length<4){confidence=Math.min(confidence,.58);issues.push("description");}
     jobs.push({
       num:i+1,status,title,hours:h,parts:p,confidence,
       comment:issues.length?`Verify ${issues.join(", ")} against photo.`:""
     });
   }
   return {ro,jobs,notes:[
     "Form-specific handwriting reader: black description/labor, red parts, and blue/purple RECON fields are read separately."
   ]};
 }

 async function analyzeApproval(img,paper){
   const roCrop=headerROCrop(img,paper);
   setAIProgress(55,"Reading RO number…");
   const rr=roCrop.density>.0015?await ocr(roCrop.url,{max_new_tokens:24}):null;
   const rt=cleanText((Array.isArray(rr)?rr[0]:rr)?.generated_text||"");
   const ro=(rt.match(/\d{5,7}/)||[])[0]||"";
   const jobs=[];
   for(let i=0;i<ROW_COUNT;i++){
     const r=rowBox(i);
     // Remove grid lines by reading only the inner part of each approval cell.
     const fix=cropInkDensity(img,paper,.72,r.y0,.785,r.y1);
     const asis=cropInkDensity(img,paper,.79,r.y0,.855,r.y1);
     if(fix<.005 && asis<.005)continue;
     let status="",confidence=.9,comment="";
     if(fix>asis*1.35 && fix>.007)status="APPROVED";
     else if(asis>fix*1.35 && asis>.007)status="DECLINED";
     else{confidence=.48;comment="Approval mark is ambiguous — verify against photo.";}
     if(status)jobs.push({num:i+1,status,confidence,comment});
   }
   return {ro,jobs,notes:jobs.length?[]:["No clear FIX / AS IS marks were detected."]};
 }

 async function analyzePhoto(kind,imageData){
   currentPhoto={kind,imageData};
   sourceImg.src=imageData;sourceWrap.style.display="block";
   try{
     setAIProgress(2,"Photo received. Locating Bish's URR form…");
     const img=await loadImg(imageData);
     const paper=detectPaperRect(img);
     await ensureHandwritingModel();
     setAIProgress(52,"Form located. Reading handwriting by row and ink color…");
     const result=kind==="approval"
       ? await analyzeApproval(img,paper)
       : await analyzeQuote(img,paper);

     const count=Array.isArray(result.jobs)?result.jobs.length:0;
     if(!count)throw new Error("The form was found, but no populated repair rows were read.");
     setAIProgress(100,`Read complete — ${count} repair row${count===1?"":"s"} found.`,"ready");
     apply(kind,result);
     if(conn&&conn.open)conn.send({type:"analysis_done",ro:result.ro||state.ro||""});
     ds.textContent="Updated from phone";ds.className="status sync";
     setTimeout(()=>{if(conn&&conn.open){ds.textContent="Phone connected";ds.className="status connected";}},1200);
   }catch(e){
     console.error(e);
     setAIProgress(parseInt(aiProgress.style.width)||5,"Handwriting reader error: "+(e?.message||String(e)),"error");
     if(conn&&conn.open)conn.send({type:"analysis_error",message:e?.message||String(e)});
   }
 }
 const save=()=>localStorage.setItem("urr_state",JSON.stringify(state));
 let conn=null,peer=null;
 q.innerHTML='<span class="spinner"></span> Starting phone pairing…';
 if(typeof Peer==="undefined"){ds.textContent="Pairing library blocked";ds.className="status error";q.innerHTML="Pairing library did not load.";}else{
   peer=new Peer();

   peer.on("error",e=>{console.error(e);ds.textContent="Pairing error";ds.className="status error";});
 }
 function apply(kind,out){
   if(out&&out.ro){state.ro=String(out.ro);ro.value=state.ro;banner.style.display="none";}
   if(kind==="quote"){
     state.jobs=(out.jobs||[]).map((j,i)=>({
       num:j.num||i+1,
       status:"PENDING",
       title:j.title||"",
       hours:j.hours??"",
       parts:j.parts??"",
       confidence:Number(j.confidence??0.75),
       comment:j.comment||""
     }));
     state.notes=out.notes||[];
   }else{
     for(const a of (out.jobs||[])){
       let j=state.jobs.find(x=>String(x.num)===String(a.num));
       if(j&&a.status)j.status=a.status;
       if(j&&Number(a.confidence)<0.82){j.confidence=Number(a.confidence);j.comment=a.comment||"Approval mark needs review.";}
     }
     state.notes=[...(state.notes||[]),...(out.notes||[])];
   }
   save();render();
 }
 function copyText(t,el){navigator.clipboard.writeText(t).then(()=>el.textContent="Copied");}
 function render(){const box=document.getElementById("jobs");box.innerHTML="";state.jobs.forEach(j=>{const d=document.createElement("div");d.className="job"+((j.confidence??1)<.82?" low":"");d.innerHTML=`<input class="num" type="number" value="${esc(j.num)}"><select class="status"><option>PENDING</option><option>APPROVED</option><option>DECLINED</option><option>RECON</option><option>NOTE</option></select><input class="title" value="${esc(j.title)}"><input class="hours" placeholder="Hours" value="${esc(j.hours)}"><input class="parts" placeholder="Parts $" value="${esc(j.parts)}"><div class="price">${money(calc(j.hours,j.parts))}</div><div class="actions"><button class="btn copy small cj">Copy Job</button><button class="btn secondary small cl">Copy Labor</button><span class="copied"></span></div>${j.comment?`<div class="comment">${esc(j.comment)}</div>`:""}`;d.querySelector(".status").value=j.status||"PENDING";for(const f of ["num","status","title","hours","parts"]){d.querySelector("."+f).addEventListener("change",e=>{j[f]=e.target.value;if(f==="num")j[f]=Number(e.target.value)||"";save();render()})}d.querySelector(".cj").onclick=()=>{if(!state.ro){banner.style.display="block";ro.focus();return}const s=j.status||"PENDING";const pre=s==="APPROVED"?`(APPROVED ${money(calc(j.hours,j.parts))})`:`(${s})`;copyText(`${pre} ${j.num}. ${String(j.title||"").toUpperCase()}`,d.querySelector(".copied"))};d.querySelector(".cl").onclick=()=>copyText(String(j.hours??""),d.querySelector(".copied"));box.appendChild(d)});document.getElementById("notes").textContent=(state.notes||[]).join(" • ");}
 ro.addEventListener("input",()=>{state.ro=ro.value.trim();banner.style.display=state.ro?"none":"block";save();if(conn&&conn.open)conn.send({type:"ro",ro:state.ro})});
 document.getElementById("add").onclick=()=>{state.jobs.push({num:state.jobs.length+1,status:"PENDING",title:"",hours:"",parts:"",confidence:1,comment:""});save();render()};
 document.getElementById("clear").onclick=()=>{if(confirm("Start a new URR?")){state={ro:"",jobs:[],notes:[]};localStorage.setItem("urr_state",JSON.stringify(state));location.reload()}};
 render();
}
