s:center}.copied{font-size:11px;color:#147a3f;font-weight:700}.comment{grid-column:1/-1;color:#8a6200;font-size:12px}.source img{max-width:100%;max-height:360px;border-radius:8px;border:1px solid #d8dee9}.ai-status{padding:10px 12px;border-radius:8px;background:#eef2f6;margin:10px 0;font-weight:700}.ai-status.ready{background:#dff7e8;color:#147a3f}.ai-status.error{background:#fee4e2;color:#b42318}.progress-wrap{height:14px;background:#e4e7ec;border-radius:999px;overflow:hidden;margin:8px 0 4px}.progress-bar{height:100%;width:0%;background:#175cd3;transition:width .25s ease}.progress-label{font-size:12px;color:#667085}.phone{max-width:520px;margin:0 auto;padding:22px}.phone h1{text-align:center}.big{display:block;width:100%;font-size:22px;padding:22px;margin:18px 0;border:0;border-radius:14px;font-weight:800;color:#fff;background:#172033;text-align:center}.big.approval{background:#0b6bcb}.phone input[type=file]{display:none}.msg{padding:12px;border-radius:10px;background:#eef2f6;margin-top:12px;text-align:center}.msg.connected{background:#dff7e8;color:#147a3f}.msg.error{background:#fee4e2;color:#b42318}.retry-link{display:block;margin-top:10px;font-weight:800;text-decoration:underline;cursor:pointer;color:#175cd3}.spinner{display:inline-block;width:16px;height:16px;border:2px solid #ddd;border-top-color:#172033;border-radius:50%;animation:spin .8s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}@media(max-width:900px){.grid{grid-template-columns:1fr}.job{grid-template-columns:60px 100px 1fr 80px 90px}.price{grid-column:1/3}.actions{grid-column:3/-1}}@media(max-width:620px){.wrap{padding:10px}.brand{font-size:22px}}

<body><div id="app"></div>
<script>
"use strict";
const RATE=199;
const qs=new URLSearchParams(location.search);
const phoneMode=qs.get("mode")==="phone" && qs.get("peer");

function esc(v){return String(v??"").replace(/[&<>'"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","'":"&#39;",'"':"&quot;"}[c]));}
function calc(h,p){h=parseFloat(h);p=parseFloat(p);if(Number.isNaN(h)&&Number.isNaN(p))return null;return Math.ceil((((Number.isNaN(h)?0:h*RATE)+(Number.isNaN(p)?0:p))/5))*5;}
function money(v){return v==null?"—":"$"+Number(v).toLocaleString("en-US",{maximumFractionDigits:0});}
function normalized(t){return String(t||"").replace(/curb\s*side|door\s*side/gi,"DS").replace(/driver\s*side|off\s*door\s*side/gi,"ODS").replace(/wheel\s*bearing\s*pack/gi,"WBP").replace(/\s+/g," ").trim();}
function findRO(t){for(const p of [/\bRO\s*(?:#|NO\.?|NUMBER)?\s*[:#-]?\s*(\d{4,8})\b/i,/\bREPAIR\s+ORDER\s*[:#-]?\s*(\d{4,8})\b/i,/\bWO\s*[:#-]?\s*(\d{4,8})\b/i]){const m=t.match(p);if(m)return m[1]}return "";}
function hours(line){for(const p of [/\b(?:LABOR|LAB|HRS?|HOURS?)\s*[:=-]?\s*(\.?\d+(?:\.\d+)?)\b/i,/\b(\d+(?:\.\d+)?)\s*(?:HRS?|HOURS?)\b/i]){const m=line.match(p);if(m)return m[1].replace(/^\./,"0.")}return "";}
function parts(line){for(const p of [/\b(?:PARTS?|PTS?)\s*[:=-]?\s*\$?\s*(\d+(?:\.\d{1,2})?)/i,/\$\s*(\d+(?:\.\d{1,2})?)/]){const m=line.match(p);if(m)return m[1]}return "";}
function strip(line){return normalized(line.replace(/\b(?:LABOR|LAB|HRS?|HOURS?|PARTS?|PTS?)\b\s*[:=-]?\s*\$?\s*\.?\d+(?:\.\d+)?/gi," ").replace(/\$\s*\d+(?:\.\d+)?/g," ").replace(/\b\d+(?:\.\d+)?\s*(?:HRS?|HOURS?)\b/gi," "));}
function parseQuote(text){
 const lines=text.replace(/\r/g,"").split("\n").map(x=>x.trim()).filter(Boolean),jobs=[];let pending="";
 for(const raw of lines){let line=normalized(raw);if(line.length<3||/^(RO|REPAIR ORDER|CUSTOMER|VIN|STOCK|DATE|TECH|TECHNICIAN)\b/i.test(line))continue;
 const nm=line.match(/^\s*(\d{1,2})[.)-]?\s+(.+)/);let num="",body=line;if(nm){num=nm[1];body=nm[2]}
 const h=hours(line),p=parts(line),meaning=/[A-Za-z]{3,}/.test(body);
 if((h||p)&&meaning){let title=strip(body).replace(/^[-:]+|[-:]+$/g,"").trim();if(pending){title=(pending+" "+title).trim();pending=""}jobs.push({num:num||jobs.length+1,title:title||"REVIEW TECH DESCRIPTION",hours:h,parts:p,status:"PENDING",confidence:.7,comment:"Browser-read result — verify handwriting."});}
 else if(num&&meaning){pending=body;} else if(meaning&&line.length>12){pending=pending?pending+" "+line:line;}
 }
 if(!jobs.length){lines.filter(x=>/[A-Za-z]{4,}/.test(x)).slice(0,12).forEach((x,i)=>jobs.push({num:i+1,title:strip(x),hours:hours(x),parts:parts(x),status:"PENDING",confidence:.45,comment:"Low-confidence browser read."}));}
 return {ro:findRO(text),jobs,notes:["Local browser OCR used. Verify flagged fields before DMS copy."]};
}
function parseApproval(text){
 const lines=text.replace(/\r/g,"").split("\n").map(normalized).filter(Boolean),jobs=[];let last="";
 for(const line of lines){const nm=line.match(/^\s*(\d{1,2})[.)-]?\s+/);if(nm)last=nm[1];let s="";if(/\b(?:FIX|APPROVE[DS]?|APPROVED|YES)\b/i.test(line))s="APPROVED";else if(/\b(?:AS\s*IS|DECLINE[DS]?|DECLINED|NO)\b/i.test(line))s="DECLINED";else if(/\bRECON\b/i.test(line))s="RECON";else if(/\bNOTE\b/i.test(line))s="NOTE";if(s)jobs.push({num:last||jobs.length+1,status:s,title:strip(line)});}
 return {ro:findRO(text),jobs,notes:jobs.length?[]:["Approval marks were not read confidently. Review statuses."]};
}
async function compress(file,max=1280,q=.86){return new Promise((res,rej)=>{const r=new FileReader(),img=new Image();r.onerror=rej;r.onload=()=>img.src=r.result;img.onload=()=>{let w=img.width,h=img.height,s=Math.min(1,max/Math.max(w,h));w=Math.round(w*s);h=Math.round(h*s);const c=document.createElement("canvas");c.width=w;c.height=h;c.getContext("2d").drawImage(img,0,0,w,h);res(c.toDataURL("image/jpeg",q));};r.readAsDataURL(file);});}
async function analyze(data,kind,progress){if(typeof Tesseract==="undefined")throw new Error("Photo reader did not load.");const r=await Tesseract.recognize(data,"eng",{logger:m=>{if(m.status==="recognizing text")progress(Math.round((m.progress||0)*100))}});const text=r.data.text||"";if(!text.trim())throw new Error("No readable text found. Retake closer.");return kind==="approval"?parseApproval(text):parseQuote(text);}

function phoneApp(){
 const host=qs.get("peer");
 app.innerHTML=`<div class="phone"><h1>URR Quick Form</h1><div id="pstatus" class="msg">Connecting to computer…</div><label class="big" for="quote">TAKE QUOTE PHOTO</label><input id="quote" type="file" accept="image/*" capture="environment"><label class="big approval" for="approval">TAKE APPROVAL PHOTO</label><input id="approval" type="file" accept="image/*" capture="environment"><div id="pmsg" class="msg">Waiting for connection.</div></div>`;
 const ps=document.getElementById("pstatus"),pm=document.getElementById("pmsg");
 function setPhoneConnectionError(message){
   ps.className="msg error";
   ps.innerHTML=`${message}<span id="rescanBanner" class="retry-link">Tap here to scan the QR again</span>`;
   const b=document.getElementById("rescanBanner");
   if(b){
     b.onclick=()=>{
       // There is no standards-based browser API that can reopen the system QR scanner directly.
       // Best browser-only behavior: return to the base page so the user can use the phone camera to rescan.
       location.href=location.origin+location.pathname+"?rescan="+Date.now();
     };
   }
 }

 if(typeof Peer==="undefined"){setPhoneConnectionError("Pairing library did not load.");return;}
 const peer=new Peer();let conn=null,attempts=0,retryTimer=null;
 function connectToComputer(){
   if(conn&&conn.open)return;
   attempts++;
   ps.textContent=attempts===1?"Connecting to computer…":`Connecting to computer… attempt ${attempts}`;
   conn=peer.connect(host,{reliable:true});
   let opened=false;
   conn.on("open",()=>{opened=true;if(retryTimer)clearTimeout(retryTimer);ps.textContent="Connected to computer";ps.className="msg connected";pm.textContent="Ready to take a photo.";conn.send({type:"refresh",reason:"phone_connected",ts:Date.now()});setInterval(()=>{if(conn&&conn.open)conn.send({type:"heartbeat",ts:Date.now()});},5000);});
   conn.on("data",d=>{
     if(!d)return;
     if(d.type==="ro"){pm.textContent=d.ro?`RO #${d.ro}`:"Ready to take a photo.";}
     else if(d.type==="ai_progress"){
       const pct=Number.isFinite(d.percent)?` ${d.percent}%`:"";
       pm.textContent=(d.message||"Computer is analyzing the photo…")+pct;
       pm.className="msg";
     }else if(d.type==="analysis_done"){
       pm.textContent=d.ro?`Analysis complete — RO #${d.ro}`:"Analysis complete. RO was not read confidently; review it on the computer.";
       pm.className="msg connected";
     }else if(d.type==="analysis_error"){
       pm.textContent="Computer could not finish the read. Review the message on the computer.";
       pm.className="msg error";
     }
   });
   conn.on("error",e=>{console.error(e);});
   conn.on("close",()=>{if(!opened&&attempts<15)retryTimer=setTimeout(connectToComputer,2000);});
   retryTimer=setTimeout(()=>{if(!opened&&attempts<15){try{conn.close()}catch{}connectToComputer()}else if(!opened){setPhoneConnectionError("Could not connect to computer.");}},2500);
 }
 peer.on("open",connectToComputer);
 peer.on("error",e=>{console.error(e);if(attempts>=15){setPhoneConnectionError("Could not connect to computer.");}});
 for(const kind of ["quote","approval"]){
  document.getElementById(kind).addEventListener("change",async ev=>{
    const f=ev.target.files[0];
    if(!f)return;
    if(!conn||!conn.open){pm.textContent="Phone is not connected to the computer.";pm.className="msg error";return;}
    try{
      pm.innerHTML='<span class="spinner"></span> Sending photo to computer…';
      const data=await compress(f,2600,.94);
      conn.send({type:"photo",kind,sourceImage:data,ts:Date.now()});
      conn.send({type:"refresh",reason:kind+"_photo_sent",ts:Date.now()});
      pm.textContent=`${kind==="quote"?"Quote":"Approval"} photo sent. Computer is analyzing the whole sheet, including the RO. Keep this page open.`;
      pm.className="msg connected";
    }catch(e){
      pm.textContent=e.message||"Could not send photo";
      pm.className="msg error";
    }finally{
      ev.target.value="";
    }
  });
}
}

function desktopApp(){
 let state;try{state=JSON.parse(localStorage.getItem("urr_state_v24"))||{ro:"",jobs:[],notes:[]}}catch{state={ro:"",jobs:[],notes:[]}}
 window.state=state;
 app.innerHTML=`<div class="wrap"><div class="top"><div><div class="brand">URR Quick Form</div><div class="muted">Phone capture → computer review → DMS copy • BUILD 24 • SPAN-AWARE HANDWRITING • LIVE SYNC</div></div><span id="dstatus" class="status">Waiting for phone</span></div><div class="grid"><div class="card qrbox"><h3>Pair Phone</h3><div id="qr" class="qr">Creating QR…</div><div id="pairFallback" style="display:none"></div><p class="muted">Scan this QR with the phone camera.</p><div class="ro-row"><b>RO#</b><input id="ro" placeholder="Required" value="${esc(state.ro)}"></div><div id="roBanner" class="banner">RO# is required.</div><div class="toolbar"><button id="add" class="btn secondary">+ Add Job</button><button id="clear" class="btn secondary">New URR</button></div></div><div class="card"><div><b>Jobs</b> <span class="muted">Verify bad handwriting reads before copying.</span></div><div id="aiStatus" class="ai-status">Form-specific handwriting reader loads automatically on the first photo.</div><div class="progress-wrap"><div id="aiProgress" class="progress-bar"></div></div><div id="aiProgressLabel" class="progress-label">Waiting for photo.</div><div id="sourceWrap" class="source" style="display:none;margin:12px 0"><b>Source photo</b><br><img id="sourceImg"></div><div id="jobs" class="jobs"></div><div id="notes" class="muted" style="margin-top:12px"></div></div></div></div>`;
 const ds=document.getElementById("dstatus"),q=document.getElementById("qr"),ro=document.getElementById("ro"),banner=document.getElementById("roBanner"),sourceWrap=document.getElementById("sourceWrap"),sourceImg=document.getElementById("sourceImg");
 const aiStatus=document.getElementById("aiStatus"),aiProgress=document.getElementById("aiProgress"),aiProgressLabel=document.getElementById("aiProgressLabel");
 let hf=null,ocr=null,aiLoading=null,currentPhoto=null;
 const FORM_SLOTS=16;

 function setAIProgress(percent,message,cls=""){
   const pct=Math.max(0,Math.min(100,Number(percent)||0));
   aiProgress.style.width=pct+"%";
   aiProgressLabel.textContent=message||"";
   aiStatus.textContent=message||"";
   aiStatus.className="ai-status"+(cls?" "+cls:"");
   if(conn&&conn.open)conn.send({type:"ai_progress",message:message||"",percent:pct});
 }

 async function ensureHandwritingModel(){
   if(ocr)return;
   if(aiLoading)return aiLoading;
   aiLoading=(async()=>{
     setAIProgress(3,"Loading higher-accuracy handwriting reader…");
     hf=await import("https://cdn.jsdelivr.net/npm/@huggingface/transformers@3.8.1");
     const {pipeline}=hf;
     ocr=await pipeline("image-to-text","Xenova/trocr-base-handwritten",{
       device:navigator.gpu?"webgpu":"wasm",
       dtype:"q8",
       progress_callback:x=>{
         if(x&&x.status==="progress"&&Number.isFinite(x.progress)){
           const pct=5+Math.round(x.progress*.45);
           setAIProgress(Math.min(50,pct),`Loading higher-accuracy handwriting model… ${Math.round(x.progress)}%`);
         }
       }
     });
     setAIProgress(51,"Handwriting model ready.","ready");
   })().catch(e=>{aiLoading=null;throw e;});
   return aiLoading;
 }

 function loadImg(src){
   return new Promise((resolve,reject)=>{
     const im=new Image();
     im.onload=()=>resolve(im);
     im.onerror=()=>reject(new Error("Could not open the URR photo."));
     im.src=src;
   });
 }

 function detectPaperRect(img){
   const max=560, s=Math.min(1,max/Math.max(img.naturalWidth,img.naturalHeight));
   const c=document.createElement("canvas");
   c.width=Math.max(1,Math.round(img.naturalWidth*s));
   c.height=Math.max(1,Math.round(img.naturalHeight*s));
   const ctx=c.getContext("2d",{willReadFrequently:true});
   ctx.drawImage(img,0,0,c.width,c.height);
   const d=ctx.getImageData(0,0,c.width,c.height).data;
   const xs=[],ys=[];
   for(let y=0;y<c.height;y+=2){
     for(let x=0;x<c.width;x+=2){
       const i=(y*c.width+x)*4,r=d[i],g=d[i+1],b=d[i+2];
       const lum=(r+g+b)/3,spread=Math.max(r,g,b)-Math.min(r,g,b);
       if(lum>145 && spread<82){xs.push(x);ys.push(y);}
     }
   }
   if(xs.length<500)return {x:0,y:0,w:img.naturalWidth,h:img.naturalHeight};
   xs.sort((a,b)=>a-b);ys.sort((a,b)=>a-b);
   const q=(a,p)=>a[Math.max(0,Math.min(a.length-1,Math.floor(a.length*p)))];
   let x0=q(xs,.02)/s,x1=q(xs,.98)/s,y0=q(ys,.02)/s,y1=q(ys,.98)/s;
   // Keep detection sane. If the "paper" estimate is too small, use the whole photo.
   if((x1-x0)<img.naturalWidth*.48 || (y1-y0)<img.naturalHeight*.55){
     return {x:0,y:0,w:img.naturalWidth,h:img.naturalHeight};
   }
   const px=(x1-x0)*.015,py=(y1-y0)*.012;
   return {x:Math.max(0,x0-px),y:Math.max(0,y0-py),
           w:Math.min(img.naturalWidth,x1-x0+2*px),
           h:Math.min(img.naturalHeight,y1-y0+2*py)};
 }

 function detectRowBands(img,paper){
   const yStart=.34,yEnd=.91,xStart=.055,xEnd=.93;
   const sw=Math.max(1,Math.round(paper.w*(xEnd-xStart)));
   const sh=Math.max(1,Math.round(paper.h*(yEnd-yStart)));
   const scale=Math.min(1,700/sw);
   const c=document.createElement("canvas");
   c.width=Math.max(1,Math.round(sw*scale));
   c.height=Math.max(1,Math.round(sh*scale));
   const ctx=c.getContext("2d",{willReadFrequently:true});
   ctx.drawImage(
     img,
     paper.x+paper.w*xStart,paper.y+paper.h*yStart,
     paper.w*(xEnd-xStart),paper.h*(yEnd-yStart),
     0,0,c.width,c.height
   );
   const d=ctx.getImageData(0,0,c.width,c.height).data;
   const score=new Array(c.height).fill(0);
   for(let y=0;y<c.height;y++){
     let dark=0;
     for(let x=0;x<c.width;x++){
       const i=(y*c.width+x)*4;
       const lum=(d[i]+d[i+1]+d[i+2])/3;
       if(lum<150) dark++;
     }
     score[y]=dark/c.width;
   }

   // Printed horizontal rules run across much of the form; handwriting does not.
   const candidates=[];
   for(let y=1;y<c.height-1;y++){
     if(score[y]>.34 && score[y]>=score[y-1] && score[y]>=score[y+1]) candidates.push(y);
   }
   const groups=[];
   for(const y of candidates){
     if(!groups.length || y-groups[groups.length-1][groups[groups.length-1].length-1]>3) groups.push([y]);
     else groups[groups.length-1].push(y);
   }
   let lines=groups.map(g=>g.reduce((a,b)=>a+b,0)/g.length);

   // Keep plausible row spacing and convert back to normalized page coordinates.
   lines=lines.map(y=>yStart+(y/c.height)*(yEnd-yStart)).sort((a,b)=>a-b);
   const dedup=[];
   for(const y of lines){
     if(!dedup.length || y-dedup[dedup.length-1]>.012) dedup.push(y);
   }

   let bands=[];
   if(dedup.length>=6){
     for(let i=0;i<dedup.length-1;i++){
       const h=dedup[i+1]-dedup[i];
       if(h>.012 && h<.07) bands.push({y0:dedup[i],y1:dedup[i+1]});
     }
   }

   // If line detection is weak, infer the physical grid spacing from whatever
   // horizontal rules were found. This is only page geometry, never repair count.
   if(bands.length<5 && dedup.length>=3){
     const gaps=[];
     for(let i=1;i<dedup.length;i++){
       const g=dedup[i]-dedup[i-1];
       if(g>.012 && g<.07)gaps.push(g);
     }
     gaps.sort((a,b)=>a-b);
     const step=gaps.length?gaps[Math.floor(gaps.length/2)]:.0305;
     let first=dedup[0], last=dedup[dedup.length-1];
     while(first-step>.34) first-=step;
     while(last+step<.91) last+=step;
     const lines=[];
     for(let y=first;y<=last+step*.25;y+=step)lines.push(y);
     bands=[];
     for(let i=0;i<lines.length-1;i++)bands.push({y0:lines[i],y1:lines[i+1]});
   }

   // Final geometry fallback for this printed Bish's form. These are physical
   // writing cells only; multiple cells can belong to one repair, and unused
   // cells do not become repairs.
   if(bands.length<5){
     bands=[];
     const top=.385,bottom=.875,cellHeight=.030625;
     for(let y=top;y+cellHeight<=bottom+.004;y+=cellHeight){
       bands.push({y0:y,y1:Math.min(bottom,y+cellHeight)});
     }
   }
   return bands;
 }

 function expandedBand(bands,i){
   const b=bands[i];
   const h=b.y1-b.y0;
   return {
     // Include substantial overlap so handwriting that drops below the printed line
     // stays with the repair above instead of being chopped off.
     y0:Math.max(.30,b.y0-h*.16),
     y1:Math.min(.96,b.y1+h*.42)
   };
 }

 function makeCrop(img,paper,nx0,ny0,nx1,ny1,mode="natural",targetW=900){
   const sx=paper.x+paper.w*nx0, sy=paper.y+paper.h*ny0;
   const sw=paper.w*(nx1-nx0), sh=paper.h*(ny1-ny0);
   const scale=Math.min(5,targetW/Math.max(1,sw));
   const c=document.createElement("canvas");
   c.width=Math.max(80,Math.round(sw*scale));
   c.height=Math.max(48,Math.round(sh*scale*1.45));
   const ctx=c.getContext("2d",{willReadFrequently:true,alpha:false});
   ctx.fillStyle="#fff";ctx.fillRect(0,0,c.width,c.height);

   // Keep the handwriting at its natural aspect ratio. TrOCR was trained on
   // natural handwriting lines; BUILD 18-22 were feeding it harsh binary images.
   const dy=Math.round(c.height*.14), dh=Math.round(c.height*.72);
   ctx.drawImage(img,sx,sy,sw,sh,0,dy,c.width,dh);

   const im=ctx.getImageData(0,0,c.width,c.height),d=im.data;
   let ink=0;

   // Grayscale/contrast enhancement while suppressing colored neighboring columns.
   // Do NOT binarize the line; preserve stroke shape and anti-aliasing for TrOCR.
   for(let i=0;i<d.length;i+=4){
     let r=d[i],g=d[i+1],b=d[i+2];
     const lum=.299*r+.587*g+.114*b;
     const spread=Math.max(r,g,b)-Math.min(r,g,b);

     let keep=true;
     if(mode==="red"){
       keep=r>70 && r>g*1.10 && r>b*1.05 && (r-g)>10;
     }else if(mode==="purple"){
       keep=(b>55 && r>55 && b>g*1.04 && r>g*1.02 && spread>8);
     }else if(mode==="black"){
       keep=lum<210 && spread<65;
     }

     let v;
     if(!keep) v=255;
     else {
       // Contrast stretch centered around the handwriting/background range.
       v=Math.max(0,Math.min(255,(lum-55)*1.48));
       if(v<205) ink++;
     }
     d[i]=d[i+1]=d[i+2]=v; d[i+3]=255;
   }

   // Remove the strongest horizontal rule remnants only at the very top/bottom.
   // We intentionally leave interior handwriting untouched.
   const w=c.width,h=c.height;
   for(let y=0;y<h;y++){
     if(y>h*.24 && y<h*.76) continue;
     let dark=0;
     for(let x=0;x<w;x++){
       const j=(y*w+x)*4;
       if(d[j]<120) dark++;
     }
     if(dark>w*.50){
       for(let yy=Math.max(0,y-2);yy<=Math.min(h-1,y+2);yy++){
         for(let x=0;x<w;x++){
           const j=(yy*w+x)*4;
           d[j]=d[j+1]=d[j+2]=255;
         }
       }
     }
   }
   ctx.putImageData(im,0,0);
   return {url:c.toDataURL("image/png"),density:ink/(w*h),canvas:c};
 }

 function cleanText(s){
   return String(s||"")
     .replace(/[|_]{2,}/g," ")
     .replace(/\s+/g," ")
     .replace(/\s+([.,])/g,"$1")
     .trim();
 }

 function normalizeRV(s){
   s=cleanText(s);
   const reps=[
     [/\boff\s*door\s*side\b/ig,"ODS"],[/\bdoor\s*side\b/ig,"DS"],
     [/\bwheel\s*bearing\s*pack\b/ig,"WBP"],[/\bl\.?\s*p\.?\b/ig,"LP"],
     [/\ba\/c\b/ig,"A/C"],[/\bwaterheater\b/ig,"water heater"],
     [/\brefrig(?:erator)?\b/ig,"refrigerator"],[/\bcompartment\b/ig,"compartment"],
     [/\bawning\b/ig,"awning"],[/\bconvertor\b/ig,"converter"]
   ];
   for(const [a,b] of reps)s=s.replace(a,b);
   return s;
 }


 function plausibleDescription(s){
   s=cleanText(s);
   if(!s || s.length<3)return false;
   const words=s.toLowerCase().match(/[a-z]+/g)||[];
   if(!words.length)return false;
   if(/^(?:[a-h]\s+){4,}[a-h]$/i.test(s))return false;
   if(/^(?:1\s*){4,}/.test(s))return false;
   if((s.match(/\b(?:000|111|aaa|bbb)\b/g)||[]).length>=2)return false;

   // Only display OCR text as a repair description when it contains recognizable
   // RV/service language. Otherwise keep the repair but flag the description for
   // human review rather than showing hallucinated English.
   const rv=/\b(?:rear|front|back|left|right|side|ds|ods|door|window|slide|slideout|awning|roof|seal|seals|trim|tire|tires|wheel|bearing|bearings|wbp|brake|brakes|axle|jack|jacks|step|steps|light|lights|lamp|clearance|marker|fender|skirt|compartment|latch|lock|handle|ladder|vent|fan|furnace|water|heater|refrigerator|fridge|stove|oven|microwave|sink|faucet|toilet|shower|floor|lino|linoleum|cabinet|drawer|blind|shade|screen|table|bed|couch|sofa|chair|panel|wall|ceiling|converter|inverter|battery|batteries|solar|lp|propane|regulator|tank|pump|plumbing|leak|leaks|crack|cracked|broken|damage|damaged|loose|missing|replace|repair|secure|adjust|reseal|sealant|caulk|motor|switch|thermostat|outlet|gfi|gfci|canvas|fabric|decal|strut|hinge|entry|storage|fresh|black|gray|grey|holding|suspension|spring|equalizer|stabilizer|leveling|leveler|cap|bumper|frame|tongue|pin|box|outside|inside|interior|exterior|counter|countertop|molding|moulding|drawer|closet|bunk|mattress|tv|television|radio|speaker|antenna|camera|monitor|ac|a\/c|air|conditioner|duct|register|thermostat|generator|shore|cord|plug|socket|receptacle|breaker|fuse|wire|wiring|harness|sensor|valve|hose|line|filter|drain|fill|gravity|city|connection|coupler|hitch|receiver|sway|roofing|membrane|skylight|shroud|grab|assist|lend|hand)\b/i;
   return rv.test(s);
 }

 function numberFromOCR(s,kind){
   let x=String(s||"").replace(/O/gi,"0").replace(/,/g,".");
   x=x.replace(/[^\d.]/g,"");
   if(!x)return "";
   const m=x.match(/\d*\.\d+|\d+/);
   if(!m)return "";
   let n=m[0];
   if(n.startsWith("."))n="0"+n;
   if(kind==="parts"){
     const v=Number(n);
     return Number.isFinite(v)?String(v):"";
   }
   const v=Number(n);
   if(!Number.isFinite(v) || v>30)return "";
   return String(v);
 }

 async function readBatches(crops,label,p0,p1){
   const out=[];
   const active=crops.map((c,i)=>({c,i})).filter(x=>x.c.density>.0018);
   const total=Math.max(1,active.length);
   for(let k=0;k<active.length;k+=6){
     const batch=active.slice(k,k+6);
     const pct=p0+(p1-p0)*(k/total);
     setAIProgress(pct,`${label} ${Math.min(k+1,total)}–${Math.min(k+batch.length,total)} of ${total}…`);
     let r=await ocr(batch.map(x=>x.c.url),{max_new_tokens:60});
     if(!Array.isArray(r))r=[r];
     // Some pipeline versions wrap batched outputs one level deeper.
     r=r.map(v=>Array.isArray(v)?v[0]:v);
     batch.forEach((x,j)=>out[x.i]=cleanText(r[j]?.generated_text||""));
     await new Promise(res=>setTimeout(res,0));
   }
   return out;
 }

 function cropInkDensity(img,paper,nx0,ny0,nx1,ny1){
   return makeCrop(img,paper,nx0,ny0,nx1,ny1,"black",260).density;
 }

 function headerROCrop(img,paper){
   // Header RO# box on Bish's fixed URR form.
   return makeCrop(img,paper,.385,.215,.555,.305,"black",500);
 }

 function buildSignalCrops(img,paper,bands){
   const desc=[],parts=[],hours=[],total=[];
   for(let i=0;i<bands.length;i++){
     const b=bands[i],h=b.y1-b.y0;
     const y0=Math.max(.30,b.y0+h*.10), y1=Math.min(.96,b.y1-h*.04);

     // Description crop is used only as an ink signal here. The description OCR
     // happens later across the full repair span, so text may cross printed lines.
     desc.push(makeCrop(img,paper,.155,y0,.575,y1,"black",520));
     parts.push(makeCrop(img,paper,.555,y0,.655,y1,"red",420));
     hours.push(makeCrop(img,paper,.635,y0,.715,y1,"black",360));
     total.push(makeCrop(img,paper,.665,y0,.775,y1,"purple",430));
   }
   return {desc,parts,hours,total};
 }

 function buildDescriptionSpanCrop(img,paper,bands,startIdx,endIdx){
   const first=bands[startIdx],last=bands[endIdx];
   const h0=first.y1-first.y0, h1=last.y1-last.y0;
   const y0=Math.max(.30,first.y0-h0*.08);
   const y1=Math.min(.96,last.y1+h1*.32);
   return makeCrop(img,paper,.145,y0,.585,y1,"black",1200);
 }

 async function analyzeQuote(img,paper){
   const roCrop=headerROCrop(img,paper);
   setAIProgress(52,"Reading RO number…");
   const roRead=roCrop.density>.0010 ? await ocr(roCrop.url,{max_new_tokens:24}) : null;
   const roText=cleanText((Array.isArray(roRead)?roRead[0]:roRead)?.generated_text||"");
   const ro=(roText.match(/\d{5,7}/)||[])[0]||"";

   const bands=detectRowBands(img,paper);
   const c=buildSignalCrops(img,paper,bands);

   // Numeric/recon cells identify repair anchors far more reliably than assuming
   // one repair per printed line.
   const parts=await readBatches(c.parts,"Reading parts cells",55,66);
   const hours=await readBatches(c.hours,"Reading labor cells",66,76);
   const totals=await readBatches(c.total,"Reading total / RECON cells",76,84);

   const slots=[];
   for(let i=0;i<bands.length;i++){
     const p=numberFromOCR(parts[i],"parts");
     const h=numberFromOCR(hours[i],"hours");
     const t=cleanText(totals[i]||"");
     const descInk=c.desc[i].density, partsInk=c.parts[i].density, hoursInk=c.hours[i].density, totalInk=c.total[i].density;

     // An anchor means "a repair is priced/classified on this physical line".
     // Continuation handwriting in the line(s) below has description ink but no
     // new parts/labor/recon anchor and is absorbed into this repair span.
     const anchor = !!p || !!h || /recon/i.test(t) ||
       partsInk>.0024 || hoursInk>.0027 || totalInk>.0030;

     const descPresent=descInk>.0030;
     slots.push({i,p,h,t,descInk,partsInk,hoursInk,totalInk,anchor,descPresent});
   }

   let starts=slots.filter(s=>s.anchor).map(s=>s.i);

   // If the first written repair has no amount, allow its description to start a
   // span. Also preserve isolated written areas that occur before the first anchor.
   const firstDesc=slots.find(s=>s.descPresent)?.i;
   if(firstDesc!=null && (!starts.length || firstDesc<starts[0]))starts.unshift(firstDesc);

   // If there are no numeric anchors at all, fall back to separated description
   // blocks, but still do not equate printed cells with repairs.
   if(!starts.length){
     let inBlock=false;
     for(let i=0;i<slots.length;i++){
       if(slots[i].descPresent && !inBlock){starts.push(i);inBlock=true;}
       if(!slots[i].descPresent)inBlock=false;
     }
   }

   starts=[...new Set(starts)].sort((a,b)=>a-b);
   if(!starts.length)return {ro,jobs:[],notes:["No repair handwriting was detected."],_bands:bands,_starts:[]};

   const spanCrops=[];
   const spans=[];
   for(let k=0;k<starts.length;k++){
     const s=starts[k];
     let e=(k+1<starts.length?starts[k+1]-1:bands.length-1);

     // Do not drag trailing blank physical cells into the last repair.
     while(e>s && !slots[e].descPresent && !slots[e].anchor)e--;

     spans.push({start:s,end:e});
     spanCrops.push(buildDescriptionSpanCrop(img,paper,bands,s,e));
   }

   const titles=await readBatches(spanCrops,"Reading full repair descriptions",84,97);

   const jobs=[];
   for(let k=0;k<spans.length;k++){
     const span=spans[k], anchorSlot=slots[span.start];
     let title=normalizeRV(titles[k]||"");
     if(!plausibleDescription(title))title="[HANDWRITING NEEDS REVIEW]";

     // Numeric values belong to the anchor line. If the first span started from a
     // description-only line, look inside its span for the first priced anchor.
     let priced=anchorSlot;
     if(!priced.anchor){
       const found=slots.slice(span.start,span.end+1).find(x=>x.anchor);
       if(found)priced=found;
     }

     const status=/recon/i.test(priced.t)?"RECON":"PENDING";
     const issues=[];
     let confidence=.90;
     if(title.startsWith("[")){confidence=.40;issues.push("description");}
     if(priced.partsInk>.0010 && !priced.p){confidence=Math.min(confidence,.58);issues.push("parts");}
     if(priced.hoursInk>.0010 && !priced.h){confidence=Math.min(confidence,.58);issues.push("labor");}

     jobs.push({
       num:jobs.length+1,
       status,
       title,
       hours:priced.h||"",
       parts:priced.p||"",
       confidence,
       comment:issues.length?`Verify ${[...new Set(issues)].join(", ")} against photo.`:"",
       _spanStart:span.start,
       _spanEnd:span.end
     });
   }

   return {
     ro,jobs,
     notes:[`Detected ${jobs.length} repair${jobs.length===1?"":"s"} from ${bands.length} physical form cells. Repairs may span multiple cells.`],
     _bands:bands,_starts:starts
   };
 }
 async function analyzeApproval(img,paper){
   setAIProgress(52,"Reading repairs from approval sheet…");
   const base=await analyzeQuote(img,paper);
   const bands=base._bands||detectRowBands(img,paper);

   setAIProgress(97,"Reading FIX / AS IS approval marks…");
   for(let j=0;j<base.jobs.length;j++){
     const job=base.jobs[j];
     const start=Number(job._spanStart);
     const end=Number(job._spanEnd);
     let fixMax=0,asisMax=0;

     for(let i=start;i<=end && i<bands.length;i++){
       const b=bands[i],h=b.y1-b.y0;
       const fix=cropInkDensity(img,paper,.72,b.y0+h*.08,.785,b.y1-h*.05);
       const asis=cropInkDensity(img,paper,.79,b.y0+h*.08,.855,b.y1-h*.05);
       fixMax=Math.max(fixMax,fix);
       asisMax=Math.max(asisMax,asis);
     }

     if(fixMax>asisMax*1.30 && fixMax>.0040){
       job.status="APPROVED";
     }else if(asisMax>fixMax*1.30 && asisMax>.0040){
       job.status="DECLINED";
     }else if(fixMax>.0030 || asisMax>.0030){
       job.confidence=Math.min(job.confidence??.7,.48);
       job.comment=(job.comment?job.comment+" ":"")+"Approval mark is ambiguous — verify.";
     }

     delete job._spanStart;
     delete job._spanEnd;
   }

   delete base._bands;
   delete base._starts;
   base.notes=[
     `Approval scan loaded ${base.jobs.length} repair${base.jobs.length===1?"":"s"}; multi-line repairs were kept together.`
   ];
   return base;
 }
 async function analyzePhoto(kind,imageData){
   currentPhoto={kind,imageData};
   sourceImg.src=imageData;sourceWrap.style.display="block";
   // Quote photos may be multiple sheets. Keep prior quote-sheet jobs and append
   // the next sheet. Approval photos replace statuses for the current sheet/session.
   if(kind==="approval"){
     state.jobs=[];
     state.notes=[];
     state.sheetCount=0;
     save();
     render();
   }
   try{
     setAIProgress(2,"Photo received. Locating Bish's URR form…");
     const img=await loadImg(imageData);
     const paper=detectPaperRect(img);
     await ensureHandwritingModel();
     setAIProgress(52,"Form located. Reading handwriting by row and ink color…");
     const result=kind==="approval"
       ? await analyzeApproval(img,paper)
       : await analyzeQuote(img,paper);

     const count=Array.isArray(result.jobs)?result.jobs.length:0;
     if(!count)throw new Error("The form was found, but no populated repair rows were read.");

     // Apply first. BUILD 18 reported "read complete" before proving that the
     // recognized rows had actually reached the review grid.
     apply(kind,result);

     const rendered=document.querySelectorAll("#jobs .job").length;
     if(kind==="quote"){
       if(rendered < count){
         throw new Error(`Reader found ${count} repairs on this sheet but only ${rendered} reached the review grid.`);
       }
       setAIProgress(100,`Sheet ${state.sheetCount}: ${count} repair${count===1?"":"s"} added. ${rendered} total loaded.`,"ready");
     }else{
       if(rendered!==count){
         throw new Error(`Reader found ${count} repairs but only ${rendered} reached the review grid.`);
       }
       setAIProgress(100,`Read complete — ${rendered} repair${rendered===1?"":"s"} loaded for review.`,"ready");
     }
     if(conn&&conn.open)conn.send({type:"analysis_done",ro:result.ro||state.ro||""});
     ds.textContent="Updated from phone";ds.className="status sync";
     setTimeout(()=>{if(conn&&conn.open){ds.textContent="Phone connected";ds.className="status connected";}},1200);
   }catch(e){
     console.error(e);
     setAIProgress(parseInt(aiProgress.style.width)||5,"Handwriting reader error: "+(e?.message||String(e)),"error");
     if(conn&&conn.open)conn.send({type:"analysis_error",message:e?.message||String(e)});
   }
 }
 const save=()=>localStorage.setItem("urr_state_v24",JSON.stringify(state));
 let conn=null,peer=null;
 q.innerHTML='<span class="spinner"></span> Starting phone pairing…';
 if(typeof Peer==="undefined"){ds.textContent="Pairing library blocked";ds.className="status error";q.innerHTML="Pairing library did not load.";}else{
   peer=new Peer();
   peer.on("open",id=>{
     ds.textContent="Pairing online — waiting for phone";
     const pairUrl=`${location.origin}${location.pathname}?mode=phone&peer=${encodeURIComponent(id)}`;
     if(typeof QRCode!=="undefined"){
       try{q.innerHTML="";new QRCode(q,{text:pairUrl,width:220,height:220,correctLevel:QRCode.CorrectLevel.M});}
       catch(e){console.error(e);q.innerHTML="QR failed to render";}
     }
     if(!q.querySelector("img")&&!q.querySelector("canvas")){
       const fb=document.getElementById("pairFallback");fb.style.display="block";fb.innerHTML=`<a href="${pairUrl}" target="_blank">Open phone pairing link</a>`;
     }
   });
   peer.on("connection",c=>{conn=c;c.on("open",()=>{ds.textContent="Phone connected";ds.className="status connected";conn.send({type:"ro",ro:state.ro})});c.on("data",d=>{
     if(!d)return;
     if(d.type==="photo"){
       analyzePhoto(d.kind,d.sourceImage);
       ds.textContent="Photo received — Handwriting reader reading";ds.className="status sync";
     } else if(d.type==="refresh"){
       render();
     } else if(d.type==="heartbeat"){
       if(conn&&conn.open){ds.textContent="Phone connected";ds.className="status connected";}
     }
   });c.on("close",()=>{ds.textContent="Phone disconnected";ds.className="status"});});
   peer.on("error",e=>{console.error(e);ds.textContent="Pairing error";ds.className="status error";});
 }
 function apply(kind,out){
   if(out&&out.ro){state.ro=String(out.ro);ro.value=state.ro;banner.style.display="none";}
   if(kind==="quote"){
     const incoming=Array.isArray(out?.jobs)?out.jobs:[];
     const startNum=Array.isArray(state.jobs)?state.jobs.length:0;
     const mapped=incoming.map((j,i)=>({
       num:startNum+i+1,
       status:["RECON","NOTE"].includes(String(j?.status||"").toUpperCase())?String(j.status).toUpperCase():"PENDING",
       title:String(j?.title||""),
       hours:j?.hours==null?"":String(j.hours),
       parts:j?.parts==null?"":String(j.parts),
       confidence:Number.isFinite(Number(j?.confidence))?Number(j.confidence):0.55,
       comment:String(j?.comment||"")
     }));
     state.jobs=[...(Array.isArray(state.jobs)?state.jobs:[]),...mapped];
     state.sheetCount=(Number(state.sheetCount)||0)+1;
     const notes=Array.isArray(out?.notes)?out.notes.map(String):[];
     state.notes=[...(state.notes||[]),`Sheet ${state.sheetCount}: ${notes.join(" ")}`];
   }else{
     const incoming=Array.isArray(out?.jobs)?out.jobs:[];
     const hasFullRows=incoming.some(a=>a && ("title" in a || "hours" in a || "parts" in a));
     if(hasFullRows){
       state.jobs=incoming.map((j,i)=>({
         num:Number(j?.num)||i+1,
         status:["APPROVED","DECLINED","RECON","NOTE","PENDING"].includes(String(j?.status||"").toUpperCase())?String(j.status).toUpperCase():"PENDING",
         title:String(j?.title||""),
         hours:j?.hours==null?"":String(j.hours),
         parts:j?.parts==null?"":String(j.parts),
         confidence:Number.isFinite(Number(j?.confidence))?Number(j.confidence):0.55,
         comment:String(j?.comment||"")
       }));
       state.notes=Array.isArray(out?.notes)?out.notes.map(String):[];
     }else{
       for(const a of incoming){
         let j=state.jobs.find(x=>String(x.num)===String(a.num));
         if(j&&a.status)j.status=a.status;
         if(j&&Number(a.confidence)<0.82){j.confidence=Number(a.confidence);j.comment=a.comment||"Approval mark needs review.";}
       }
       state.notes=[...(state.notes||[]),...(out.notes||[])];
     }
   }
   save();render();
 }
 function copyText(t,el){navigator.clipboard.writeText(t).then(()=>el.textContent="Copied");}
 function render(){
   const box=document.getElementById("jobs");
   box.innerHTML="";
   const list=Array.isArray(state.jobs)?state.jobs:[];
   list.forEach((j,idx)=>{
     try{
       const d=document.createElement("div");d.className="job"+((j.confidence??1)<.82?" low":"");d.innerHTML=`<input class="num" type="number" value="${esc(j.num)}"><select class="status"><option>PENDING</option><option>APPROVED</option><option>DECLINED</option><option>RECON</option><option>NOTE</option></select><input class="title" value="${esc(j.title)}"><input class="hours" placeholder="Hours" value="${esc(j.hours)}"><input class="parts" placeholder="Parts $" value="${esc(j.parts)}"><div class="price">${money(calc(j.hours,j.parts))}</div><div class="actions"><button class="btn copy small cj">Copy Job</button><button class="btn secondary small cl">Copy Labor</button><span class="copied"></span></div>${j.comment?`<div class="comment">${esc(j.comment)}</div>`:""}`;d.querySelector(".status").value=j.status||"PENDING";for(const f of ["num","status","title","hours","parts"]){d.querySelector("."+f).addEventListener("change",e=>{j[f]=e.target.value;if(f==="num")j[f]=Number(e.target.value)||"";save();render()})}d.querySelector(".cj").onclick=()=>{if(!state.ro){banner.style.display="block";ro.focus();return}const s=j.status||"PENDING";const pre=s==="APPROVED"?`(APPROVED ${money(calc(j.hours,j.parts))})`:`(${s})`;copyText(`${pre} ${j.num}. ${String(j.title||"").toUpperCase()}`,d.querySelector(".copied"))};d.querySelector(".cl").onclick=()=>copyText(String(j.hours??""),d.querySelector(".copied"));box.appendChild(d);
     }catch(e){
       console.error("Could not render OCR row",idx+1,e,j);
       const err=document.createElement("div");
       err.className="banner";
       err.style.display="block";
       err.textContent=`Row ${idx+1} was read but could not be displayed: ${e.message||e}`;
       box.appendChild(err);
     }
   });
   document.getElementById("notes").textContent=(state.notes||[]).join(" • ");
 }
 ro.addEventListener("input",()=>{state.ro=ro.value.trim();banner.style.display=state.ro?"none":"block";save();if(conn&&conn.open)conn.send({type:"ro",ro:state.ro})});
 document.getElementById("add").onclick=()=>{state.jobs.push({num:state.jobs.length+1,status:"PENDING",title:"",hours:"",parts:"",confidence:1,comment:""});save();render()};
 document.getElementById("clear").onclick=()=>{if(confirm("Start a new URR?")){state={ro:"",jobs:[],notes:[]};localStorage.setItem("urr_state_v24",JSON.stringify(state));location.reload()}};
 render();
}
if(phoneMode)phoneApp();else desktopApp();
