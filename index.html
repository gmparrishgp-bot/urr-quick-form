<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>URR Quick Form</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/peerjs/1.5.5/peerjs.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
<style>
:root{font-family:Arial,Helvetica,sans-serif;color:#172033;background:#f5f7fb}*{box-sizing:border-box}body{margin:0}.wrap{max-width:1400px;margin:auto;padding:20px}.top{display:flex;gap:16px;align-items:center;justify-content:space-between;margin-bottom:18px}.brand{font-size:28px;font-weight:800}.muted{color:#667085}.card{background:#fff;border:1px solid #d8dee9;border-radius:12px;padding:16px;box-shadow:0 1px 3px rgba(0,0,0,.05)}.grid{display:grid;grid-template-columns:320px 1fr;gap:16px}.qrbox{text-align:center}.qr{width:220px;height:220px;margin:0 auto 12px;display:flex;align-items:center;justify-content:center}.qr img,.qr canvas{width:220px!important;height:220px!important}.status{font-weight:700;padding:6px 10px;border-radius:999px;display:inline-block;background:#fff1cc;color:#8a6200}.status.connected{background:#dff7e8;color:#147a3f}.status.error{background:#fee4e2;color:#b42318}.ro-row{display:flex;gap:8px;align-items:center;margin:12px 0}.ro-row input{font-size:20px;font-weight:700;padding:10px 12px;width:220px;border:2px solid #98a2b3;border-radius:8px}.banner{padding:10px 12px;border-radius:8px;margin:10px 0;background:#fff4e5;border:1px solid #f7b955;display:none}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}.btn{border:0;border-radius:8px;padding:10px 14px;font-weight:700;cursor:pointer;background:#172033;color:#fff}.btn.secondary{background:#eef2f6;color:#172033}.btn.copy{background:#0b6bcb}.btn.small{padding:7px 10px;font-size:12px}.jobs{display:flex;flex-direction:column;gap:10px}.job{display:grid;grid-template-columns:75px 120px minmax(260px,1fr) 90px 100px 100px 230px;gap:8px;align-items:center;border:1px solid #e4e7ec;border-radius:10px;padding:10px;background:#fff}.job.low{border:2px solid #f79009;background:#fffcf5}.job input,.job select{width:100%;padding:8px;border:1px solid #cfd4dc;border-radius:6px}.title{font-weight:700}.price{font-weight:800}.actions{display:flex;gap:6px;align-items:center}.copied{font-size:11px;color:#147a3f;font-weight:700}.comment{grid-column:1/-1;color:#8a6200;font-size:12px}.source img{max-width:100%;max-height:300px;border-radius:8px;border:1px solid #d8dee9}.phone{max-width:520px;margin:0 auto;padding:22px}.phone h1{text-align:center}.big{display:block;width:100%;font-size:22px;padding:22px;margin:18px 0;border:0;border-radius:14px;font-weight:800;color:#fff;background:#172033;text-align:center}.big.approval{background:#0b6bcb}.phone input[type=file]{display:none}.msg{padding:12px;border-radius:10px;background:#eef2f6;margin-top:12px;text-align:center}.msg.connected{background:#dff7e8;color:#147a3f}.msg.error{background:#fee4e2;color:#b42318}.spinner{display:inline-block;width:16px;height:16px;border:2px solid #ddd;border-top-color:#172033;border-radius:50%;animation:spin .8s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}@media(max-width:900px){.grid{grid-template-columns:1fr}.job{grid-template-columns:60px 100px 1fr 80px 90px}.price{grid-column:1/3}.actions{grid-column:3/-1}}@media(max-width:620px){.wrap{padding:10px}.brand{font-size:22px}}
</style>
</head>
<body><div id="app"></div>
<script>
"use strict";
const RATE=199;
const qs=new URLSearchParams(location.search);
const phoneMode=qs.get("mode")==="phone" && qs.get("peer");

function esc(v){return String(v??"").replace(/[&<>'"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","'":"&#39;",'"':"&quot;"}[c]));}
function calc(h,p){h=parseFloat(h);p=parseFloat(p);if(Number.isNaN(h)&&Number.isNaN(p))return null;return Math.ceil((((Number.isNaN(h)?0:h*RATE)+(Number.isNaN(p)?0:p))/5))*5;}
function money(v){return v==null?"—":"$"+Number(v).toLocaleString("en-US",{maximumFractionDigits:0});}
function normalized(t){return String(t||"").replace(/curb\s*side|door\s*side/gi,"DS").replace(/driver\s*side|off\s*door\s*side/gi,"ODS").replace(/wheel\s*bearing\s*pack/gi,"WBP").replace(/\s+/g," ").trim();}
function findRO(t){for(const p of [/\bRO\s*(?:#|NO\.?|NUMBER)?\s*[:#-]?\s*(\d{4,8})\b/i,/\bREPAIR\s+ORDER\s*[:#-]?\s*(\d{4,8})\b/i,/\bWO\s*[:#-]?\s*(\d{4,8})\b/i]){const m=t.match(p);if(m)return m[1]}return "";}
function hours(line){for(const p of [/\b(?:LABOR|LAB|HRS?|HOURS?)\s*[:=-]?\s*(\.?\d+(?:\.\d+)?)\b/i,/\b(\d+(?:\.\d+)?)\s*(?:HRS?|HOURS?)\b/i]){const m=line.match(p);if(m)return m[1].replace(/^\./,"0.")}return "";}
function parts(line){for(const p of [/\b(?:PARTS?|PTS?)\s*[:=-]?\s*\$?\s*(\d+(?:\.\d{1,2})?)/i,/\$\s*(\d+(?:\.\d{1,2})?)/]){const m=line.match(p);if(m)return m[1]}return "";}
function strip(line){return normalized(line.replace(/\b(?:LABOR|LAB|HRS?|HOURS?|PARTS?|PTS?)\b\s*[:=-]?\s*\$?\s*\.?\d+(?:\.\d+)?/gi," ").replace(/\$\s*\d+(?:\.\d+)?/g," ").replace(/\b\d+(?:\.\d+)?\s*(?:HRS?|HOURS?)\b/gi," "));}
function parseQuote(text){
 const lines=text.replace(/\r/g,"").split("\n").map(x=>x.trim()).filter(Boolean),jobs=[];let pending="";
 for(const raw of lines){let line=normalized(raw);if(line.length<3||/^(RO|REPAIR ORDER|CUSTOMER|VIN|STOCK|DATE|TECH|TECHNICIAN)\b/i.test(line))continue;
 const nm=line.match(/^\s*(\d{1,2})[.)-]?\s+(.+)/);let num="",body=line;if(nm){num=nm[1];body=nm[2]}
 const h=hours(line),p=parts(line),meaning=/[A-Za-z]{3,}/.test(body);
 if((h||p)&&meaning){let title=strip(body).replace(/^[-:]+|[-:]+$/g,"").trim();if(pending){title=(pending+" "+title).trim();pending=""}jobs.push({num:num||jobs.length+1,title:title||"REVIEW TECH DESCRIPTION",hours:h,parts:p,status:"PENDING",confidence:.7,comment:"Browser-read result — verify handwriting."});}
 else if(num&&meaning){pending=body;} else if(meaning&&line.length>12){pending=pending?pending+" "+line:line;}
 }
 if(!jobs.length){lines.filter(x=>/[A-Za-z]{4,}/.test(x)).slice(0,12).forEach((x,i)=>jobs.push({num:i+1,title:strip(x),hours:hours(x),parts:parts(x),status:"PENDING",confidence:.45,comment:"Low-confidence browser read."}));}
 return {ro:findRO(text),jobs,notes:["Local browser OCR used. Verify flagged fields before DMS copy."]};
}
function parseApproval(text){
 const lines=text.replace(/\r/g,"").split("\n").map(normalized).filter(Boolean),jobs=[];let last="";
 for(const line of lines){const nm=line.match(/^\s*(\d{1,2})[.)-]?\s+/);if(nm)last=nm[1];let s="";if(/\b(?:FIX|APPROVE[DS]?|APPROVED|YES)\b/i.test(line))s="APPROVED";else if(/\b(?:AS\s*IS|DECLINE[DS]?|DECLINED|NO)\b/i.test(line))s="DECLINED";else if(/\bRECON\b/i.test(line))s="RECON";else if(/\bNOTE\b/i.test(line))s="NOTE";if(s)jobs.push({num:last||jobs.length+1,status:s,title:strip(line)});}
 return {ro:findRO(text),jobs,notes:jobs.length?[]:["Approval marks were not read confidently. Review statuses."]};
}
async function compress(file,max=1800,q=.88){return new Promise((res,rej)=>{const r=new FileReader(),img=new Image();r.onerror=rej;r.onload=()=>img.src=r.result;img.onload=()=>{let w=img.width,h=img.height,s=Math.min(1,max/Math.max(w,h));w=Math.round(w*s);h=Math.round(h*s);const c=document.createElement("canvas");c.width=w;c.height=h;c.getContext("2d").drawImage(img,0,0,w,h);res(c.toDataURL("image/jpeg",q));};r.readAsDataURL(file);});}
async function analyze(data,kind,progress){if(typeof Tesseract==="undefined")throw new Error("Photo reader did not load.");const r=await Tesseract.recognize(data,"eng",{logger:m=>{if(m.status==="recognizing text")progress(Math.round((m.progress||0)*100))}});const text=r.data.text||"";if(!text.trim())throw new Error("No readable text found. Retake closer.");return kind==="approval"?parseApproval(text):parseQuote(text);}

function phoneApp(){
 const host=qs.get("peer");
 app.innerHTML=`<div class="phone"><h1>URR Quick Form</h1><div id="pstatus" class="msg">Connecting to computer…</div><label class="big" for="quote">TAKE QUOTE PHOTO</label><input id="quote" type="file" accept="image/*" capture="environment"><label class="big approval" for="approval">TAKE APPROVAL PHOTO</label><input id="approval" type="file" accept="image/*" capture="environment"><div id="pmsg" class="msg">Waiting for connection.</div></div>`;
 const ps=document.getElementById("pstatus"),pm=document.getElementById("pmsg");
 if(typeof Peer==="undefined"){ps.textContent="Pairing library did not load";ps.className="msg error";return;}
 const peer=new Peer();let conn=null;
 peer.on("open",()=>{conn=peer.connect(host,{reliable:true});conn.on("open",()=>{ps.textContent="Connected to computer";ps.className="msg connected";pm.textContent="Ready to take a photo."});conn.on("data",d=>{if(d&&d.type==="ro")pm.textContent=d.ro?`RO #${d.ro}`:"Ready to take a photo.";});conn.on("error",()=>{ps.textContent="Phone connection error";ps.className="msg error"});});
 peer.on("error",e=>{console.error(e);ps.textContent="Could not connect — rescan the QR";ps.className="msg error"});
 for(const kind of ["quote","approval"]){document.getElementById(kind).addEventListener("change",async ev=>{const f=ev.target.files[0];if(!f)return;if(!conn||!conn.open){pm.textContent="Phone is not connected to the computer.";pm.className="msg error";return;}try{pm.innerHTML='<span class="spinner"></span> Preparing photo…';const data=await compress(f);const out=await analyze(data,kind,n=>pm.innerHTML=`<span class="spinner"></span> Reading photo… ${n}%`);if(!out.ro){const r=prompt("RO# was not found. Enter RO#:");if(!r)throw new Error("RO# required");out.ro=r.trim()}conn.send({type:"analysis",kind,result:out,sourceImage:data});pm.textContent=`${kind==="quote"?"Quote":"Approval"} sent to computer — RO #${out.ro}`;pm.className="msg connected";}catch(e){pm.textContent=e.message||"Could not process photo";pm.className="msg error"}finally{ev.target.value=""}});}
}

function desktopApp(){
 let state;try{state=JSON.parse(localStorage.getItem("urr_state"))||{ro:"",jobs:[],notes:[]}}catch{state={ro:"",jobs:[],notes:[]}}
 window.state=state;
 app.innerHTML=`<div class="wrap"><div class="top"><div><div class="brand">URR Quick Form</div><div class="muted">Phone capture → computer review → DMS copy • BUILD 5</div></div><span id="dstatus" class="status">Waiting for phone</span></div><div class="grid"><div class="card qrbox"><h3>Pair Phone</h3><div id="qr" class="qr">Creating QR…</div><div id="pairFallback" style="display:none"></div><p class="muted">Scan this QR with the phone camera.</p><div class="ro-row"><b>RO#</b><input id="ro" placeholder="Required" value="${esc(state.ro)}"></div><div id="roBanner" class="banner">RO# is required.</div><div class="toolbar"><button id="add" class="btn secondary">+ Add Job</button><button id="clear" class="btn secondary">New URR</button></div></div><div class="card"><div><b>Jobs</b> <span class="muted">Verify bad handwriting reads before copying.</span></div><div id="sourceWrap" class="source" style="display:none;margin:12px 0"><b>Source photo</b><br><img id="sourceImg"></div><div id="jobs" class="jobs"></div><div id="notes" class="muted" style="margin-top:12px"></div></div></div></div>`;
 const ds=document.getElementById("dstatus"),q=document.getElementById("qr"),ro=document.getElementById("ro"),banner=document.getElementById("roBanner"),sourceWrap=document.getElementById("sourceWrap"),sourceImg=document.getElementById("sourceImg");
 const save=()=>localStorage.setItem("urr_state",JSON.stringify(state));
 let conn=null,peer=null;
 const id="urr-"+(crypto.randomUUID?crypto.randomUUID().replace(/-/g,"").slice(0,20):(Date.now()+Math.random().toString(16).slice(2)));
 const pairUrl=`${location.origin}${location.pathname}?mode=phone&peer=${encodeURIComponent(id)}`;
 if(typeof QRCode!=="undefined"){try{q.innerHTML="";new QRCode(q,{text:pairUrl,width:220,height:220,correctLevel:QRCode.CorrectLevel.M});}catch(e){console.error(e);}}
 if(!q.querySelector("img")&&!q.querySelector("canvas")){q.innerHTML="QR failed to render";document.getElementById("pairFallback").style.display="block";document.getElementById("pairFallback").innerHTML=`<a href="${pairUrl}" target="_blank">Open phone pairing link</a>`;}
 if(typeof Peer==="undefined"){ds.textContent="Pairing library blocked";ds.className="status error";}else{
   peer=new Peer(id);
   peer.on("open",()=>{ds.textContent="Waiting for phone";});
   peer.on("connection",c=>{conn=c;c.on("open",()=>{ds.textContent="Phone connected";ds.className="status connected";conn.send({type:"ro",ro:state.ro})});c.on("data",d=>{if(d&&d.type==="analysis"){if(d.sourceImage){sourceImg.src=d.sourceImage;sourceWrap.style.display="block"}apply(d.kind,d.result)}});c.on("close",()=>{ds.textContent="Phone disconnected";ds.className="status"});});
   peer.on("error",e=>{console.error(e);ds.textContent="Pairing error";ds.className="status error";});
 }
 function apply(kind,out){if(out.ro){state.ro=String(out.ro);ro.value=state.ro}if(kind==="quote"){state.jobs=(out.jobs||[]).map((j,i)=>({num:j.num||i+1,status:j.status||"PENDING",title:j.title||"",hours:j.hours??"",parts:j.parts??"",confidence:j.confidence??1,comment:j.comment||""}));state.notes=out.notes||[]}else{for(const [i,a] of (out.jobs||[]).entries()){let j=state.jobs.find(x=>String(x.num)===String(a.num))||state.jobs[i];if(j&&a.status)j.status=a.status}state.notes=[...(state.notes||[]),...(out.notes||[])]}save();render();}
 function copyText(t,el){navigator.clipboard.writeText(t).then(()=>el.textContent="Copied");}
 function render(){const box=document.getElementById("jobs");box.innerHTML="";state.jobs.forEach(j=>{const d=document.createElement("div");d.className="job"+((j.confidence??1)<.82?" low":"");d.innerHTML=`<input class="num" type="number" value="${esc(j.num)}"><select class="status"><option>PENDING</option><option>APPROVED</option><option>DECLINED</option><option>RECON</option><option>NOTE</option></select><input class="title" value="${esc(j.title)}"><input class="hours" placeholder="Hours" value="${esc(j.hours)}"><input class="parts" placeholder="Parts $" value="${esc(j.parts)}"><div class="price">${money(calc(j.hours,j.parts))}</div><div class="actions"><button class="btn copy small cj">Copy Job</button><button class="btn secondary small cl">Copy Labor</button><span class="copied"></span></div>${j.comment?`<div class="comment">${esc(j.comment)}</div>`:""}`;d.querySelector(".status").value=j.status||"PENDING";for(const f of ["num","status","title","hours","parts"]){d.querySelector("."+f).addEventListener("change",e=>{j[f]=e.target.value;if(f==="num")j[f]=Number(e.target.value)||"";save();render()})}d.querySelector(".cj").onclick=()=>{if(!state.ro){banner.style.display="block";ro.focus();return}const s=j.status||"PENDING";const pre=s==="APPROVED"?`(APPROVED ${money(calc(j.hours,j.parts))})`:`(${s})`;copyText(`${pre} ${j.num}. ${String(j.title||"").toUpperCase()}`,d.querySelector(".copied"))};d.querySelector(".cl").onclick=()=>copyText(String(j.hours??""),d.querySelector(".copied"));box.appendChild(d)});document.getElementById("notes").textContent=(state.notes||[]).join(" • ");}
 ro.addEventListener("input",()=>{state.ro=ro.value.trim();banner.style.display=state.ro?"none":"block";save();if(conn&&conn.open)conn.send({type:"ro",ro:state.ro})});
 document.getElementById("add").onclick=()=>{state.jobs.push({num:state.jobs.length+1,status:"PENDING",title:"",hours:"",parts:"",confidence:1,comment:""});save();render()};
 document.getElementById("clear").onclick=()=>{if(confirm("Start a new URR?")){state={ro:"",jobs:[],notes:[]};localStorage.setItem("urr_state",JSON.stringify(state));location.reload()}};
 render();
}
if(phoneMode)phoneApp();else desktopApp();
</script></body></html>
