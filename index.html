<script>
"use strict";
const RATE=199;
const qs=new URLSearchParams(location.search);
const phoneMode=qs.get("mode")==="phone" && qs.get("peer");

function esc(v){return String(v??"").replace(/[&<>'"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","'":"&#39;",'"':"&quot;"}[c]));}
function calc(h,p){h=parseFloat(h);p=parseFloat(p);if(Number.isNaN(h)&&Number.isNaN(p))return null;return Math.ceil((((Number.isNaN(h)?0:h*RATE)+(Number.isNaN(p)?0:p))/5))*5;}
function money(v){return v==null?"—":"$"+Number(v).toLocaleString("en-US",{maximumFractionDigits:0});}
function normalized(t){return String(t||"").replace(/curb\s*side|door\s*side/gi,"DS").replace(/driver\s*side|off\s*door\s*side/gi,"ODS").replace(/wheel\s*bearing\s*pack/gi,"WBP").replace(/\s+/g," ").trim();}
function findRO(t){for(const p of [/\bRO\s*(?:#|NO\.?|NUMBER)?\s*[:#-]?\s*(\d{4,8})\b/i,/\bREPAIR\s+ORDER\s*[:#-]?\s*(\d{4,8})\b/i,/\bWO\s*[:#-]?\s*(\d{4,8})\b/i]){const m=t.match(p);if(m)return m[1]}return "";}
function hours(line){for(const p of [/\b(?:LABOR|LAB|HRS?|HOURS?)\s*[:=-]?\s*(\.?\d+(?:\.\d+)?)\b/i,/\b(\d+(?:\.\d+)?)\s*(?:HRS?|HOURS?)\b/i]){const m=line.match(p);if(m)return m[1].replace(/^\./,"0.")}return "";}
function parts(line){for(const p of [/\b(?:PARTS?|PTS?)\s*[:=-]?\s*\$?\s*(\d+(?:\.\d{1,2})?)/i,/\$\s*(\d+(?:\.\d{1,2})?)/]){const m=line.match(p);if(m)return m[1]}return "";}
function strip(line){return normalized(line.replace(/\b(?:LABOR|LAB|HRS?|HOURS?|PARTS?|PTS?)\b\s*[:=-]?\s*\$?\s*\.?\d+(?:\.\d+)?/gi," ").replace(/\$\s*\d+(?:\.\d+)?/g," ").replace(/\b\d+(?:\.\d+)?\s*(?:HRS?|HOURS?)\b/gi," "));}
function parseQuote(text){
 const lines=text.replace(/\r/g,"").split("\n").map(x=>x.trim()).filter(Boolean),jobs=[];let pending="";
 for(const raw of lines){let line=normalized(raw);if(line.length<3||/^(RO|REPAIR ORDER|CUSTOMER|VIN|STOCK|DATE|TECH|TECHNICIAN)\b/i.test(line))continue;
 const nm=line.match(/^\s*(\d{1,2})[.)-]?\s+(.+)/);let num="",body=line;if(nm){num=nm[1];body=nm[2]}
 const h=hours(line),p=parts(line),meaning=/[A-Za-z]{3,}/.test(body);
 if((h||p)&&meaning){let title=strip(body).replace(/^[-:]+|[-:]+$/g,"").trim();if(pending){title=(pending+" "+title).trim();pending=""}jobs.push({num:num||jobs.length+1,title:title||"REVIEW TECH DESCRIPTION",hours:h,parts:p,status:"PENDING",confidence:.7,comment:"Browser-read result — verify handwriting."});}
 else if(num&&meaning){pending=body;} else if(meaning&&line.length>12){pending=pending?pending+" "+line:line;}
 }
 if(!jobs.length){lines.filter(x=>/[A-Za-z]{4,}/.test(x)).slice(0,12).forEach((x,i)=>jobs.push({num:i+1,title:strip(x),hours:hours(x),parts:parts(x),status:"PENDING",confidence:.45,comment:"Low-confidence browser read."}));}
 return {ro:findRO(text),jobs,notes:["Local browser OCR used. Verify flagged fields before DMS copy."]};
}
function parseApproval(text){
 const lines=text.replace(/\r/g,"").split("\n").map(normalized).filter(Boolean),jobs=[];let last="";
 for(const line of lines){const nm=line.match(/^\s*(\d{1,2})[.)-]?\s+/);if(nm)last=nm[1];let s="";if(/\b(?:FIX|APPROVE[DS]?|APPROVED|YES)\b/i.test(line))s="APPROVED";else if(/\b(?:AS\s*IS|DECLINE[DS]?|DECLINED|NO)\b/i.test(line))s="DECLINED";else if(/\bRECON\b/i.test(line))s="RECON";else if(/\bNOTE\b/i.test(line))s="NOTE";if(s)jobs.push({num:last||jobs.length+1,status:s,title:strip(line)});}
 return {ro:findRO(text),jobs,notes:jobs.length?[]:["Approval marks were not read confidently. Review statuses."]};
}
async function compress(file,max=1800,q=.88){return new Promise((res,rej)=>{const r=new FileReader(),img=new Image();r.onerror=rej;r.onload=()=>img.src=r.result;img.onload=()=>{let w=img.width,h=img.height,s=Math.min(1,max/Math.max(w,h));w=Math.round(w*s);h=Math.round(h*s);const c=document.createElement("canvas");c.width=w;c.height=h;c.getContext("2d").drawImage(img,0,0,w,h);res(c.toDataURL("image/jpeg",q));};r.readAsDataURL(file);});}
async function analyze(data,kind,progress){if(typeof Tesseract==="undefined")throw new Error("Photo reader did not load.");const r=await Tesseract.recognize(data,"eng",{logger:m=>{if(m.status==="recognizing text")progress(Math.round((m.progress||0)*100))}});const text=r.data.text||"";if(!text.trim())throw new Error("No readable text found. Retake closer.");return kind==="approval"?parseApproval(text):parseQuote(text);}

function phoneApp(){
 const host=qs.get("peer");
 app.innerHTML=`<div class="phone"><h1>URR Quick Form</h1><div id="pstatus" class="msg">Connecting to computer…</div><label class="big" for="quote">TAKE QUOTE PHOTO</label><input id="quote" type="file" accept="image/*" capture="environment"><label class="big approval" for="approval">TAKE APPROVAL PHOTO</label><input id="approval" type="file" accept="image/*" capture="environment"><div id="pmsg" class="msg">Waiting for connection.</div></div>`;
 const ps=document.getElementById("pstatus"),pm=document.getElementById("pmsg");
 function setPhoneConnectionError(message){
   ps.className="msg error";
   ps.innerHTML=`${message}<span id="rescanBanner" class="retry-link">Tap here to scan the QR again</span>`;
   const b=document.getElementById("rescanBanner");
   if(b){
     b.onclick=()=>{
       // There is no standards-based browser API that can reopen the system QR scanner directly.
       // Best browser-only behavior: return to the base page so the user can use the phone camera to rescan.
       location.href=location.origin+location.pathname+"?rescan="+Date.now();
     };
   }
 }

 if(typeof Peer==="undefined"){setPhoneConnectionError("Pairing library did not load.");return;}
 const peer=new Peer();let conn=null,attempts=0,retryTimer=null;
 function connectToComputer(){
   if(conn&&conn.open)return;
   attempts++;
   ps.textContent=attempts===1?"Connecting to computer…":`Connecting to computer… attempt ${attempts}`;
   conn=peer.connect(host,{reliable:true});
   let opened=false;
   conn.on("open",()=>{opened=true;if(retryTimer)clearTimeout(retryTimer);ps.textContent="Connected to computer";ps.className="msg connected";pm.textContent="Ready to take a photo.";conn.send({type:"refresh",reason:"phone_connected",ts:Date.now()});setInterval(()=>{if(conn&&conn.open)conn.send({type:"heartbeat",ts:Date.now()});},5000);});
   conn.on("data",d=>{
     if(!d)return;
     if(d.type==="ro"){pm.textContent=d.ro?`RO #${d.ro}`:"Ready to take a photo.";}
     else if(d.type==="ai_progress"){
       const pct=Number.isFinite(d.percent)?` ${d.percent}%`:"";
       pm.textContent=(d.message||"Computer is analyzing the photo…")+pct;
       pm.className="msg";
     }else if(d.type==="analysis_done"){
       pm.textContent=d.ro?`Analysis complete — RO #${d.ro}`:"Analysis complete. RO was not read confidently; review it on the computer.";
       pm.className="msg connected";
     }else if(d.type==="analysis_error"){
       pm.textContent="Computer could not finish the read. Review the message on the computer.";
       pm.className="msg error";
     }
   });
   conn.on("error",e=>{console.error(e);});
   conn.on("close",()=>{if(!opened&&attempts<15)retryTimer=setTimeout(connectToComputer,2000);});
   retryTimer=setTimeout(()=>{if(!opened&&attempts<15){try{conn.close()}catch{}connectToComputer()}else if(!opened){setPhoneConnectionError("Could not connect to computer.");}},2500);
 }
 peer.on("open",connectToComputer);
 peer.on("error",e=>{console.error(e);if(attempts>=15){setPhoneConnectionError("Could not connect to computer.");}});
 for(const kind of ["quote","approval"]){
  document.getElementById(kind).addEventListener("change",async ev=>{
    const f=ev.target.files[0];
    if(!f)return;
    if(!conn||!conn.open){pm.textContent="Phone is not connected to the computer.";pm.className="msg error";return;}
    try{
      pm.innerHTML='<span class="spinner"></span> Sending photo to computer…';
      const data=await compress(f,2200,.92);
      conn.send({type:"photo",kind,sourceImage:data,ts:Date.now()});
      conn.send({type:"refresh",reason:kind+"_photo_sent",ts:Date.now()});
      pm.textContent=`${kind==="quote"?"Quote":"Approval"} photo sent. Computer is analyzing the whole sheet, including the RO.`;
      pm.className="msg connected";
    }catch(e){
      pm.textContent=e.message||"Could not send photo";
      pm.className="msg error";
    }finally{
      ev.target.value="";
    }
  });
}
}

function desktopApp(){
 let state;try{state=JSON.parse(localStorage.getItem("urr_state"))||{ro:"",jobs:[],notes:[]}}catch{state={ro:"",jobs:[],notes:[]}}
 window.state=state;
 app.innerHTML=`<div class="wrap"><div class="top"><div><div class="brand">URR Quick Form</div><div class="muted">Phone capture → computer review → DMS copy • BUILD 10 • LOCAL VISION AI • LIVE SYNC</div></div><span id="dstatus" class="status">Waiting for phone</span></div><div class="grid"><div class="card qrbox"><h3>Pair Phone</h3><div id="qr" class="qr">Creating QR…</div><div id="pairFallback" style="display:none"></div><p class="muted">Scan this QR with the phone camera.</p><div class="ro-row"><b>RO#</b><input id="ro" placeholder="Required" value="${esc(state.ro)}"></div><div id="roBanner" class="banner">RO# is required.</div><div class="toolbar"><button id="add" class="btn secondary">+ Add Job</button><button id="clear" class="btn secondary">New URR</button></div></div><div class="card"><div><b>Jobs</b> <span class="muted">Verify bad handwriting reads before copying.</span></div><div id="aiStatus" class="ai-status">Vision AI will load automatically on the first photo.</div><div class="progress-wrap"><div id="aiProgress" class="progress-bar"></div></div><div id="aiProgressLabel" class="progress-label">Waiting for photo.</div><div id="sourceWrap" class="source" style="display:none;margin:12px 0"><b>Source photo</b><br><img id="sourceImg"></div><div id="jobs" class="jobs"></div><div id="notes" class="muted" style="margin-top:12px"></div></div></div></div>`;
 const ds=document.getElementById("dstatus"),q=document.getElementById("qr"),ro=document.getElementById("ro"),banner=document.getElementById("roBanner"),sourceWrap=document.getElementById("sourceWrap"),sourceImg=document.getElementById("sourceImg");
 const aiStatus=document.getElementById("aiStatus"),aiProgress=document.getElementById("aiProgress"),aiProgressLabel=document.getElementById("aiProgressLabel");
 let aiWorker=null, aiReady=false, pendingAI=null, modelStarted=false;
 function makeAIWorker(){
   const workerCode = `
import {
  AutoProcessor,
  AutoModelForVision2Seq,
  TextStreamer,
  load_image
} from "https://cdn.jsdelivr.net/npm/@huggingface/transformers@3.8.1";

const MODEL_ID = "HuggingFaceTB/SmolVLM-256M-Instruct";
let processor=null, model=null;

async function loadModel(){
  if(processor && model) return;
  self.postMessage({type:"model_status",message:"Checking graphics support…"});
  if(!navigator.gpu) throw new Error("This computer does not support WebGPU in this browser.");
  self.postMessage({type:"model_status",message:"Loading local vision model. First use may take several minutes…"});
  processor = await AutoProcessor.from_pretrained(MODEL_ID,{
    progress_callback:x=>{
      if(x && x.status==="progress" && Number.isFinite(x.progress)){
        self.postMessage({type:"model_progress",progress:Math.round(x.progress),file:x.file||""});
      }
    }
  });
  model = await AutoModelForVision2Seq.from_pretrained(MODEL_ID,{
    device:"webgpu",
    dtype:{
      embed_tokens:"fp32",
      vision_encoder:"q4",
      decoder_model_merged:"q4"
    },
    progress_callback:x=>{
      if(x && x.status==="progress" && Number.isFinite(x.progress)){
        self.postMessage({type:"model_progress",progress:Math.round(x.progress),file:x.file||""});
      }
    }
  });
  self.postMessage({type:"model_ready"});
}

function promptFor(kind){
  if(kind==="approval"){
    return \`You are visually reviewing a Bish's RV Used Recommended Repairs approval sheet. Read the ENTIRE image, including handwriting, checkmarks, circles, notes, and row numbers. Use RV/service context to resolve handwriting. Your response MUST begin with { and end with }. Return ONLY one JSON object, no markdown, no explanation:
{"ro":"","jobs":[{"num":1,"status":"APPROVED","confidence":0.95,"comment":""}],"notes":[]}
Rules:
- RO is the repair order number if visible.
- FIX, approved, yes, or an approval mark means APPROVED.
- AS IS, declined, no, or a clear rejection mark means DECLINED.
- RECON means RECON.
- NOTE means NOTE.
- Match every status to the printed/handwritten job row number.
- Do not invent rows or statuses.
- If a mark is ambiguous, use your best contextual read, lower confidence, and explain briefly in comment.
- Read like an experienced RV service manager, not a character OCR engine.\`;
  }
  return \`You are visually reviewing a Bish's RV Used Recommended Repairs technician quote sheet. Read the ENTIRE image and interpret the handwriting using RV service context. Your response MUST begin with { and end with }. Return ONLY one JSON object, no markdown, no explanation:
{"ro":"","jobs":[{"num":1,"title":"","hours":"","parts":"","confidence":0.95,"comment":""}],"notes":[]}
Rules:
- Extract every repair row in order.
- RO is the repair order number if visible.
- title = concise technician repair description. Preserve technical meaning.
- Normalize door side to DS, off door side to ODS, and wheel bearing pack to WBP.
- hours = the handwritten quoted labor time EXACTLY as intended. Pay special attention to decimals such as .2, .3, .5, .75, 1.0, 2.0. Convert ".3" to "0.3".
- parts = the handwritten parts dollar amount only, no tax/freight/markup.
- Do NOT calculate totals. The webpage calculates at $199/hr.
- Do NOT omit a row because it looks like RECON; still extract quoted hours and parts.
- Use RV knowledge to distinguish words and numbers. Look at neighboring rows/columns and the whole form before deciding.
- Never invent a number. If uncertain, give the best read, lower confidence below 0.82, and explain what is uncertain in comment.
- Treat this as visual reasoning over the document, not simple OCR.\`;
}

function cleanupJSONText(s){
  s=String(s||"").trim()
    .replace(new RegExp("\\x60\\x60\\x60json","gi"),"").replace(new RegExp("\\x60\\x60\\x60","g"),"")
    .replace(/[“”]/g,'"').replace(/[‘’]/g,"'");
  const first=s.indexOf("{"), last=s.lastIndexOf("}");
  if(first>=0 && last>first) s=s.slice(first,last+1);
  s=s.replace(/,\s*([}\]])/g,"$1");
  return s;
}
function looseResult(s,kind){
  const t=String(s||"").replace(/\r/g,"");
  const ro=(t.match(/\b(?:RO|REPAIR\s*ORDER|WO)\s*(?:#|NO\.?|NUMBER)?\s*[:#-]?\s*(\d{4,8})\b/i)||[])[1]||"";
  const jobs=[];
  const lines=t.split("\n").map(x=>x.trim()).filter(Boolean);
  for(const line of lines){
    if(kind==="approval"){
      const nm=(line.match(/^\s*(\d{1,2})[.)-]?\s+/)||[])[1]||"";
      let status="";
      if(/\b(APPROVED|APPROVE|FIX|YES)\b/i.test(line))status="APPROVED";
      else if(/\b(DECLINED|DECLINE|AS\s*IS|NO)\b/i.test(line))status="DECLINED";
      else if(/\bRECON\b/i.test(line))status="RECON";
      else if(/\bNOTE\b/i.test(line))status="NOTE";
      if(status) jobs.push({num:nm||jobs.length+1,status,confidence:.55,comment:"Recovered from unstructured vision output."});
    }else{
      const m=line.match(/^\s*(\d{1,2})[.)-]?\s*(.*?)\s*(?:\||,)\s*(?:HRS?|HOURS?|LABOR)?\s*[:=]?\s*(\.?\d+(?:\.\d+)?)?\s*(?:\||,)\s*(?:PARTS?)?\s*[:=$]?\s*\$?(\d+(?:\.\d+)?)?/i);
      if(m && /[A-Za-z]{3}/.test(m[2]||"")){
        jobs.push({num:m[1]||jobs.length+1,title:(m[2]||"").trim(),hours:(m[3]||"").replace(/^\./,"0."),parts:m[4]||"",confidence:.5,comment:"Recovered from unstructured vision output — verify."});
      }
    }
  }
  return {ro,jobs,notes:["Vision output required fallback parsing. Verify all orange fields."]};
}
function extractStructured(s,kind){
  const cleaned=cleanupJSONText(s);
  try{
    const obj=JSON.parse(cleaned);
    if(obj && typeof obj==="object") return obj;
  }catch{}
  return looseResult(s,kind);
}

async function analyze(imageData,kind){
  await loadModel();
  self.postMessage({type:"analysis_status",message:"Reading the whole URR sheet…"});
  const image=await load_image(imageData);
  const messages=[{role:"user",content:[{type:"image",image:imageData},{type:"text",text:promptFor(kind)}]}];
  const prompt=processor.apply_chat_template(messages,{add_generation_prompt:true});
  const inputs=await processor(prompt,[image],{do_image_splitting:true});
  let streamed="";
  const streamer=new TextStreamer(processor.tokenizer,{
    skip_prompt:true,
    skip_special_tokens:true,
    callback_function:chunk=>{streamed+=chunk; self.postMessage({type:"analysis_stream",text:streamed});}
  });
  const output=await model.generate({
    ...inputs,
    do_sample:false,
    repetition_penalty:1.05,
    max_new_tokens:900,
    streamer,
    return_dict_in_generate:true
  });
  let finalText=streamed;
  try{
    const decoded=processor.batch_decode(output.sequences,{skip_special_tokens:true});
    if(decoded && decoded[0]) finalText=decoded[0];
  }catch{}
  const parsed=extractStructured(finalText,kind);
  self.postMessage({type:"analysis_complete",kind,result:parsed,raw:finalText});
}

self.onmessage=async e=>{
  const m=e.data||{};
  try{
    if(m.type==="load") await loadModel();
    if(m.type==="analyze") await analyze(m.imageData,m.kind);
  }catch(err){
    self.postMessage({type:"ai_error",message:err?.message||String(err)});
  }
};
`;
   const url=URL.createObjectURL(new Blob([workerCode],{type:"text/javascript"}));
   aiWorker=new Worker(url,{type:"module"});
   aiWorker.onmessage=e=>{
     const m=e.data||{};
     if(m.type==="model_status"){
       aiStatus.textContent=m.message;aiStatus.className="ai-status";aiProgress.style.width="5%";aiProgressLabel.textContent=m.message;
       if(conn&&conn.open)conn.send({type:"ai_progress",message:m.message,percent:5});
     }
     else if(m.type==="model_progress"){
       const pct=Math.max(5,Math.min(70,Math.round((m.progress||0)*.65)+5));
       aiStatus.textContent=`Loading local vision model… ${m.progress}%`;
       aiProgress.style.width=pct+"%";aiProgressLabel.textContent=`Loading model${m.file?" • "+m.file:""} — ${m.progress}%`;
       if(conn&&conn.open)conn.send({type:"ai_progress",message:"Loading local vision model…",percent:pct});
     }
     else if(m.type==="model_ready"){
       aiReady=true;aiStatus.textContent="Local vision AI ready.";aiStatus.className="ai-status ready";
       aiProgress.style.width="72%";aiProgressLabel.textContent="Model ready. Starting image analysis…";
       if(conn&&conn.open)conn.send({type:"ai_progress",message:"Model ready. Starting image analysis…",percent:72});
       if(pendingAI){const x=pendingAI;pendingAI=null;aiWorker.postMessage({type:"analyze",kind:x.kind,imageData:x.imageData});}
     }
     else if(m.type==="analysis_status"){
       aiStatus.textContent=m.message;aiStatus.className="ai-status";aiProgress.style.width="78%";aiProgressLabel.textContent=m.message;
       if(conn&&conn.open)conn.send({type:"ai_progress",message:m.message,percent:78});
     }
     else if(m.type==="analysis_stream"){
       aiStatus.textContent="Interpreting handwriting, rows, RO, labor, parts, and approval marks…";
       const cur=parseInt(aiProgress.style.width)||78;const pct=Math.min(96,cur+1);aiProgress.style.width=pct+"%";aiProgressLabel.textContent="Interpreting the whole URR sheet…";
       if(conn&&conn.open)conn.send({type:"ai_progress",message:"Interpreting the whole URR sheet…",percent:pct});
     }
     else if(m.type==="analysis_complete"){
       aiProgress.style.width="100%";aiProgressLabel.textContent="Analysis complete.";
       aiStatus.textContent="Vision AI read complete — verify orange fields.";aiStatus.className="ai-status ready";
       apply(m.kind,m.result);ds.textContent="Updated from phone";ds.className="status sync";
       if(conn&&conn.open)conn.send({type:"analysis_done",ro:(m.result&&m.result.ro)||state.ro||""});
       setTimeout(()=>{if(conn&&conn.open){ds.textContent="Phone connected";ds.className="status connected"}},1200);
     }
     else if(m.type==="ai_error"){
       aiProgressLabel.textContent="Analysis stopped.";aiStatus.textContent="Vision AI error: "+m.message;aiStatus.className="ai-status error";
       if(conn&&conn.open)conn.send({type:"analysis_error",message:m.message});
     }
   };
   aiWorker.onerror=e=>{aiStatus.textContent="Vision AI worker error. Refresh and retry.";aiStatus.className="ai-status error";console.error(e);};
 }
 function analyzePhoto(kind,imageData){
   if(!aiWorker) makeAIWorker();
   sourceImg.src=imageData;sourceWrap.style.display="block";
   pendingAI={kind,imageData};aiProgress.style.width="2%";aiProgressLabel.textContent="Photo received. Preparing local vision AI…";if(conn&&conn.open)conn.send({type:"ai_progress",message:"Photo received. Preparing analysis…",percent:2});
   if(!modelStarted){modelStarted=true;aiWorker.postMessage({type:"load"});}
   else if(aiReady){pendingAI=null;aiWorker.postMessage({type:"analyze",kind,imageData});}
   else{aiStatus.textContent="Vision AI is still loading. The photo is queued automatically.";}
 }

 const save=()=>localStorage.setItem("urr_state",JSON.stringify(state));
 let conn=null,peer=null;
 q.innerHTML='<span class="spinner"></span> Starting phone pairing…';
 if(typeof Peer==="undefined"){ds.textContent="Pairing library blocked";ds.className="status error";q.innerHTML="Pairing library did not load.";}else{
   peer=new Peer();
   peer.on("open",id=>{
     ds.textContent="Pairing online — waiting for phone";
     const pairUrl=`${location.origin}${location.pathname}?mode=phone&peer=${encodeURIComponent(id)}`;
     if(typeof QRCode!=="undefined"){
       try{q.innerHTML="";new QRCode(q,{text:pairUrl,width:220,height:220,correctLevel:QRCode.CorrectLevel.M});}
       catch(e){console.error(e);q.innerHTML="QR failed to render";}
     }
     if(!q.querySelector("img")&&!q.querySelector("canvas")){
       const fb=document.getElementById("pairFallback");fb.style.display="block";fb.innerHTML=`<a href="${pairUrl}" target="_blank">Open phone pairing link</a>`;
     }
   });
   peer.on("connection",c=>{conn=c;c.on("open",()=>{ds.textContent="Phone connected";ds.className="status connected";conn.send({type:"ro",ro:state.ro})});c.on("data",d=>{
     if(!d)return;
     if(d.type==="photo"){
       analyzePhoto(d.kind,d.sourceImage);
       ds.textContent="Photo received — Vision AI reading";ds.className="status sync";
     } else if(d.type==="refresh"){
       render();
     } else if(d.type==="heartbeat"){
       if(conn&&conn.open){ds.textContent="Phone connected";ds.className="status connected";}
     }
   });c.on("close",()=>{ds.textContent="Phone disconnected";ds.className="status"});});
   peer.on("error",e=>{console.error(e);ds.textContent="Pairing error";ds.className="status error";});
 }
 function apply(kind,out){
   if(out&&out.ro){state.ro=String(out.ro);ro.value=state.ro;banner.style.display="none";}
   if(kind==="quote"){
     state.jobs=(out.jobs||[]).map((j,i)=>({
       num:j.num||i+1,
       status:"PENDING",
       title:j.title||"",
       hours:j.hours??"",
       parts:j.parts??"",
       confidence:Number(j.confidence??0.75),
       comment:j.comment||""
     }));
     state.notes=out.notes||[];
   }else{
     for(const a of (out.jobs||[])){
       let j=state.jobs.find(x=>String(x.num)===String(a.num));
       if(j&&a.status)j.status=a.status;
       if(j&&Number(a.confidence)<0.82){j.confidence=Number(a.confidence);j.comment=a.comment||"Approval mark needs review.";}
     }
     state.notes=[...(state.notes||[]),...(out.notes||[])];
   }
   save();render();
 }
 function copyText(t,el){navigator.clipboard.writeText(t).then(()=>el.textContent="Copied");}
 function render(){const box=document.getElementById("jobs");box.innerHTML="";state.jobs.forEach(j=>{const d=document.createElement("div");d.className="job"+((j.confidence??1)<.82?" low":"");d.innerHTML=`<input class="num" type="number" value="${esc(j.num)}"><select class="status"><option>PENDING</option><option>APPROVED</option><option>DECLINED</option><option>RECON</option><option>NOTE</option></select><input class="title" value="${esc(j.title)}"><input class="hours" placeholder="Hours" value="${esc(j.hours)}"><input class="parts" placeholder="Parts $" value="${esc(j.parts)}"><div class="price">${money(calc(j.hours,j.parts))}</div><div class="actions"><button class="btn copy small cj">Copy Job</button><button class="btn secondary small cl">Copy Labor</button><span class="copied"></span></div>${j.comment?`<div class="comment">${esc(j.comment)}</div>`:""}`;d.querySelector(".status").value=j.status||"PENDING";for(const f of ["num","status","title","hours","parts"]){d.querySelector("."+f).addEventListener("change",e=>{j[f]=e.target.value;if(f==="num")j[f]=Number(e.target.value)||"";save();render()})}d.querySelector(".cj").onclick=()=>{if(!state.ro){banner.style.display="block";ro.focus();return}const s=j.status||"PENDING";const pre=s==="APPROVED"?`(APPROVED ${money(calc(j.hours,j.parts))})`:`(${s})`;copyText(`${pre} ${j.num}. ${String(j.title||"").toUpperCase()}`,d.querySelector(".copied"))};d.querySelector(".cl").onclick=()=>copyText(String(j.hours??""),d.querySelector(".copied"));box.appendChild(d)});document.getElementById("notes").textContent=(state.notes||[]).join(" • ");}
 ro.addEventListener("input",()=>{state.ro=ro.value.trim();banner.style.display=state.ro?"none":"block";save();if(conn&&conn.open)conn.send({type:"ro",ro:state.ro})});
 document.getElementById("add").onclick=()=>{state.jobs.push({num:state.jobs.length+1,status:"PENDING",title:"",hours:"",parts:"",confidence:1,comment:""});save();render()};
 document.getElementById("clear").onclick=()=>{if(confirm("Start a new URR?")){state={ro:"",jobs:[],notes:[]};localStorage.setItem("urr_state",JSON.stringify(state));location.reload()}};
 render();
}
if(phoneMode)phoneApp();else desktopApp();
</script></body></html>
