<html lang="en">
<head>

<title>URR Quick Form</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/peerjs/1.5.5/peerjs.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
:root{font-family:Arial,Helvetica,sans-serif;color:#172033;background:#f5f7fb}*{box-sizing:border-box}body{margin:0}.wrap{max-width:1400px;margin:auto;padding:20px}.top{display:flex;gap:16px;align-items:center;justify-content:space-between;margin-bottom:18px}.brand{font-size:28px;font-weight:800}.muted{color:#667085}.card{background:#fff;border:1px solid #d8dee9;border-radius:12px;padding:16px;box-shadow:0 1px 3px rgba(0,0,0,.05)}.grid{display:grid;grid-template-columns:320px 1fr;gap:16px}.qrbox{text-align:center}.qr{width:220px;height:220px;margin:0 auto 12px;display:flex;align-items:center;justify-content:center}.qr img,.qr canvas{width:220px!important;height:220px!important}.status{font-weight:700;padding:6px 10px;border-radius:999px;display:inline-block;background:#fff1cc;color:#8a6200}.status.connected{background:#dff7e8;color:#147a3f}.status.error{background:#fee4e2;color:#b42318}.status.sync{background:#e8f1ff;color:#175cd3}.ro-row{display:flex;gap:8px;align-items:center;margin:12px 0}.ro-row input{font-size:20px;font-weight:700;padding:10px 12px;width:220px;border:2px solid #98a2b3;border-radius:8px}.banner{padding:10px 12px;border-radius:8px;margin:10px 0;background:#fff4e5;border:1px solid #f7b955;display:none}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}.btn{border:0;border-radius:8px;padding:10px 14px;font-weight:700;cursor:pointer;background:#172033;color:#fff}.btn.secondary{background:#eef2f6;color:#172033}.btn.copy{background:#0b6bcb}.btn.small{padding:7px 10px;font-size:12px}.jobs{display:flex;flex-direction:column;gap:10px}.job{display:grid;grid-template-columns:75px 120px minmax(260px,1fr) 90px 100px 100px 230px;gap:8px;align-items:center;border:1px solid #e4e7ec;border-radius:10px;padding:10px;background:#fff}.job.low{border:2px solid #f79009;background:#fffcf5}.job input,.job select{width:100%;padding:8px;border:1px solid #cfd4dc;border-radius:6px}.job input.field-low{border:2px solid #f79009;background:#fffcf5}.title{font-weight:700}.price{font-weight:800}.actions{display:flex;gap:6px;align-items:center}.copied{font-size:11px;color:#147a3f;font-weight:700}.comment{grid-column:1/-1;color:#8a6200;font-size:12px}.source-gallery{display:flex;gap:10px;flex-wrap:wrap;margin-top:8px}.source-gallery img{width:170px;max-height:240px;object-fit:contain;border-radius:8px;border:1px solid #d8dee9;background:#fff}.ai-status{padding:10px 12px;border-radius:8px;background:#eef2f6;margin:10px 0;font-weight:700}.ai-status.ready{background:#dff7e8;color:#147a3f}.ai-status.error{background:#fee4e2;color:#b42318}.progress-wrap{height:14px;background:#e4e7ec;border-radius:999px;overflow:hidden;margin:8px 0 4px}.progress-bar{height:100%;width:0%;background:#175cd3;transition:width .25s ease}.progress-label{font-size:12px;color:#667085}.phone{max-width:520px;margin:0 auto;padding:22px}.phone h1{text-align:center}.big{display:block;width:100%;font-size:22px;padding:22px;margin:18px 0;border:0;border-radius:14px;font-weight:800;color:#fff;background:#172033;text-align:center}.big.approval{background:#0b6bcb}.phone input[type=file]{display:none}.msg{padding:12px;border-radius:10px;background:#eef2f6;margin-top:12px;text-align:center}.msg.connected{background:#dff7e8;color:#147a3f}.msg.error{background:#fee4e2;color:#b42318}.retry-link{display:block;margin-top:10px;font-weight:800;text-decoration:underline;cursor:pointer;color:#175cd3}.spinner{display:inline-block;width:16px;height:16px;border:2px solid #ddd;border-top-color:#172033;border-radius:50%;animation:spin .8s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}@media(max-width:900px){.grid{grid-template-columns:1fr}.job{grid-template-columns:60px 100px 1fr 80px 90px}.price{grid-column:1/3}.actions{grid-column:3/-1}}@media(max-width:620px){.wrap{padding:10px}.brand{font-size:22px}}
</style>
</head>

</html>
