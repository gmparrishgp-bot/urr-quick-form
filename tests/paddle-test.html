<!doctype html><meta charset="utf-8"><title>Paddle OCR test</title><pre id="out">starting</pre><script type="module">
import { PaddleOCR } from 'https://cdn.jsdelivr.net/npm/@paddleocr/paddleocr-js/+esm';
const out=document.getElementById('out');
function loadImg(url){return new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=url;});}
function variant(img,kind){
  const scale=kind==='original'?1:3;
  const c=document.createElement('canvas');c.width=img.width*scale;c.height=img.height*scale;
  const x=c.getContext('2d',{willReadFrequently:true});x.imageSmoothingEnabled=true;x.imageSmoothingQuality='high';x.drawImage(img,0,0,c.width,c.height);
  if(kind==='original')return c;
  const im=x.getImageData(0,0,c.width,c.height),d=im.data;
  for(let k=0;k<d.length;k+=4){
    let y=.299*d[k]+.587*d[k+1]+.114*d[k+2];
    if(kind==='contrast') y=Math.max(0,Math.min(255,(y-128)*1.65+128));
    if(kind==='threshold') y=y<185?0:255;
    if(kind==='soft') y=Math.max(0,Math.min(255,(y-70)*1.3));
    d[k]=d[k+1]=d[k+2]=y;d[k+3]=255;
  }
  x.putImageData(im,0,0);return c;
}
try {
  const ocr=await PaddleOCR.create({textDetectionModelName:'PP-OCRv5_mobile_det',textRecognitionModelName:'PP-OCRv5_mobile_rec',textDetectionBatchSize:1,textRecognitionBatchSize:8,ortOptions:{backend:'wasm',wasmPaths:'https://cdn.jsdelivr.net/npm/onnxruntime-web/dist/',numThreads:1,simd:true}});
  const variants=['original','contrast','soft','threshold'];
  const fixtures=['01','02'];
  const results=[];
  for(const fixture of fixtures){
    const img=await loadImg('/tests/'+fixture+'.jpg');
    for(const kind of variants){
      const [result]=await ocr.predict(variant(img,kind),{textDetLimitSideLen:1600,textDetLimitType:'max',textDetThresh:.12,textDetBoxThresh:.12,textDetUnclipRatio:1.8,textRecScoreThresh:.03});
      const text=(result?.items||[]).map(x=>x.text).join(' ').trim();
      results.push({fixture,kind,text,items:result?.items||[],metrics:result?.metrics||{}});
      out.textContent=results.map(r=>r.fixture+' '+r.kind+': '+r.text).join('\n');
    }
  }
  window.__ocr={done:true,results};
}catch(e){out.textContent='ERROR '+(e?.stack||e);window.__ocr={done:true,error:String(e?.stack||e)}}
</script>
