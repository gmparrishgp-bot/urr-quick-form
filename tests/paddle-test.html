<!doctype html><meta charset="utf-8"><title>Paddle OCR test</title><pre id="out">starting</pre><script type="module">
import { PaddleOCR } from 'https://cdn.jsdelivr.net/npm/@paddleocr/paddleocr-js/+esm';
const out=document.getElementById('out');
try {
  out.textContent='loading';
  const ocr=await PaddleOCR.create({
    textDetectionModelName:'PP-OCRv5_mobile_det',
    textRecognitionModelName:'PP-OCRv5_mobile_rec',
    ortOptions:{backend:'wasm'}
  });
  out.textContent='loaded';
  const blob=await (await fetch('/tests/01.jpg')).blob();
  const [result]=await ocr.predict(blob,{
    textDetLimitSideLen:1280,
    textDetLimitType:'max',
    textDetThresh:.15,
    textDetBoxThresh:.15,
    textDetUnclipRatio:1.8,
    textRecScoreThresh:.05
  });
  const text=(result?.items||[]).map(x=>x.text).join(' ').trim();
  out.textContent=text;
  window.__ocr={done:true,text,items:result?.items||[],metrics:result?.metrics||{}};
} catch(e) {
  out.textContent='ERROR '+(e?.stack||e);
  window.__ocr={done:true,error:String(e?.stack||e)};
}
</script>
